<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crush.X</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #fff7fc;
      --card: rgba(255,255,255,.84);
      --strong: rgba(255,255,255,.97);
      --text: #171b2e;
      --muted: #64748b;
      --line: rgba(148,163,184,.18);
      --shadow: rgba(124,58,237,.12);
    }

    .dark {
      --bg: #090d18;
      --card: rgba(15,23,42,.88);
      --strong: rgba(17,24,39,.98);
      --text: #edf3ff;
      --muted: #9aa9c5;
      --line: rgba(148,163,184,.18);
      --shadow: rgba(2,6,23,.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255,79,163,.14), transparent 20%),
        radial-gradient(circle at top right, rgba(124,58,237,.15), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .glass {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 14px 32px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .glass-strong {
      background: var(--strong);
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .gradient-main {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed 52%, #38bdf8);
    }

    .text-gradient {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .story-ring {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed, #38bdf8);
      padding: 2px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 30;
      width: min(94vw, 560px);
      transform: translateX(-50%);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(10px);
    }

    .loader.show {
      display: flex;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #authOverlay, #confirmationModal { overflow-y: auto; }
    #authOverlay > div, #confirmationModal > div { margin: auto; }
    input, textarea, .flex-1 { min-width: 0; }
    main { overflow-wrap: anywhere; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .bottom-nav { bottom: max(12px, env(safe-area-inset-bottom)); }
    .bottom-nav button { min-width: 0; flex: 1; padding-inline: 3px; }
    .reel-media { height: min(65dvh, 650px); }
    @media (max-width: 1199px) {
      header .desktop-nav {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Login and signup -->
  <div id="authOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xl">
    <div class="glass-strong w-full max-w-md rounded-[2rem] p-6">
      <div class="text-center">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl gradient-main text-3xl font-black text-white">
          C
        </div>

        <h1 id="authTitle" class="mt-4 text-3xl font-black text-gradient">
          Welcome to Crush.X
        </h1>

        <p id="authDescription" class="mt-2 text-sm text-slate-500">
          Find your vibe. Match your mood.
        </p>
      </div>

      <form id="authForm" novalidate class="mt-6 space-y-3">
        <input
          aria-label="Username or email" id="usernameInput"
          type="text"
          autocomplete="username"
          placeholder="Username or email"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />

        <input
          aria-label="Email address" id="emailInput"
          type="email"
          autocomplete="email"
          placeholder="Email address"
          class="hidden w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />

        <input
          aria-label="Password" id="passwordInput"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />
        <input aria-label="Reset code" id="resetCodeInput" class="hidden w-full rounded-2xl border px-4 py-3" placeholder="Reset code" autocomplete="one-time-code" />
      </form>

      <button
        type="submit" form="authForm"
        id="authButton"
        class="mt-5 w-full rounded-2xl gradient-main px-4 py-3.5 text-sm font-bold text-white"
      >
        Login
      </button>

      <div class="mt-5 flex justify-between text-sm">
        <button id="switchAuthButton" class="font-bold text-pink-600">
          Create account
        </button>

        <button id="forgotButton" class="font-semibold text-slate-500">
          Forgot password?
        </button>
      </div>

      <div role="status" aria-live="polite" id="authMessage" class="mt-4 hidden rounded-2xl p-3 text-center text-xs font-bold"></div>
    </div>
  </div>

  <!-- Account confirmation -->
  <div id="confirmationModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xl">
    <div class="glass-strong w-full max-w-md rounded-[2rem] p-6">
      <h2 class="text-2xl font-black">Verify your account</h2>
      <p class="mt-2 text-sm text-slate-500">
        Enter the verification code sent to your email.
      </p>

      <input
        aria-label="Verification code" id="confirmationCode"
        maxlength="6"
        inputmode="numeric"
        placeholder="Verification code"
        class="mt-5 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-center text-xl tracking-[.5em] outline-none dark:border-slate-700 dark:bg-slate-900"
      />

      <button
        id="confirmButton"
        class="mt-4 w-full rounded-2xl gradient-main px-4 py-3 font-bold text-white"
      >
        Verify account
      </button>

      <div id="confirmationMessage" role="status" class="mt-3 text-sm"></div>
      <button id="cancelConfirmation" class="mt-3 w-full text-sm">Back to login</button>
      <button
        id="resendButton"
        class="mt-4 w-full text-sm font-bold text-pink-600"
      >
        Resend code
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loader" class="loader">
    <div class="text-center text-white">
      <div class="spinner mx-auto"></div>
      <div id="loaderText" class="mt-4 text-sm font-bold">Please wait...</div>
    </div>
  </div>

  <div id="app" class="min-h-screen"></div>

  <script>

    let signUpMode = false;
    let recoveryMode = null;
    let recoveryUser = null;

    const defaultState = {

        {
          id: 'story_1',

        }
      ],

          likes: 1248,

          ]
        },

          image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=1200&q=80',
          location: 'Seoul',
          caption: 'Life in color and coffee. ☕️',
          likes: 2450,
          shares: 42,
          comments: [
            { user: 'mounnishant1', text: 'The palette is immaculate.' }
          ]
        }
      ],
      reels: [
        {
          id: 'reel_1',
          userId: 'me',
          source: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80',
          caption: 'Midnight city vibes ✨',
          likes: 2189,
          comments: 420,
          shares: 33,
          song: 'Midnight City',
          artist: 'M83'
        }
      ]
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    let memoryState = clone(defaultState);
    function getState() {
      let saved;
      try { saved = localStorage.getItem(STATE_KEY); }
      catch { return clone(memoryState); }

      if (!saved) {
        saveState(clone(defaultState));
        return clone(defaultState);
      }

      try {
        return {
          ...clone(defaultState),
          ...JSON.parse(saved)
        };
      } catch {
        saveState(clone(defaultState));
        return clone(defaultState);
      }
    }

    function saveState(state) {
      memoryState = clone(state);
      try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
      catch { /* Browser storage unavailable: keep local actions for this page only. */ }
    }

    function currentUser(state) {
      return state.users.find(user => user.id === state.currentUserId) || state.users[0];
    }

    function userById(state, id) {
      return state.users.find(user => user.id === id);
    }

    function escapeHTML(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatText(value = '') {
      return escapeHTML(value).replace(
        /(@[a-zA-Z0-9_.]+)/g,
        '<span class="font-bold text-pink-500">$1</span>'
      );
    }

    function showLoader(message) {
      document.getElementById('loaderText').textContent = message;
      document.getElementById('loader').classList.add('show');
      document.querySelectorAll('#authOverlay button, #confirmationModal button').forEach(b => b.disabled = true);
    }

    function hideLoader() {
      document.getElementById('loader').classList.remove('show');
      document.querySelectorAll('#authOverlay button, #confirmationModal button').forEach(b => b.disabled = false);
    }

    function showAuthMessage(message, success = false) {
      const element = document.getElementById('authMessage');

      if (!message) {
        element.className = 'hidden';
        return;
      }

      element.textContent = message;
      element.className = success
        ? 'mt-4 rounded-2xl bg-emerald-100 p-3 text-center text-xs font-bold text-emerald-700'
        : 'mt-4 rounded-2xl bg-red-100 p-3 text-center text-xs font-bold text-red-700';
    }

    function getCognitoPool() {
      if (!window.AmazonCognitoIdentity) {
        throw new Error('Cognito SDK failed to load.');
      }

      if (!cognitoPool) {
        cognitoPool =
          new AmazonCognitoIdentity.CognitoUserPool(COGNITO_CONFIG);
      }

      return cognitoPool;
    }

    function toggleAuthMode() {
      if (recoveryMode) {
        recoveryMode = null;
        recoveryUser = null;
        signUpMode = true;
      }
      signUpMode = !signUpMode;
      document.getElementById('passwordInput').classList.remove('hidden');
      document.getElementById('resetCodeInput').classList.add('hidden');
      document.getElementById('resetCodeInput').value = '';
      document.getElementById('usernameInput').readOnly = false;
      document.getElementById('passwordInput').placeholder = 'Password';
      document.getElementById('passwordInput').autocomplete = signUpMode ? 'new-password' : 'current-password';

      document.getElementById('authTitle').textContent =
        signUpMode ? 'Create Account' : 'Welcome to Crush.X';

      document.getElementById('authDescription').textContent =
        signUpMode
          ? 'Join the Crush.X community.'
          : 'Find your vibe. Match your mood.';

      document.getElementById('authButton').textContent =
        signUpMode ? 'Register' : 'Login';

      document.getElementById('switchAuthButton').textContent =
        signUpMode ? 'Already have an account?' : 'Create account';

      document.getElementById('emailInput').classList.toggle(
        'hidden',
        !signUpMode
      );

      document.getElementById('forgotButton').classList.toggle(
        'hidden',
        signUpMode
      );

      document.getElementById('usernameInput').placeholder =
        signUpMode ? 'Choose a username' : 'Username or email';

      document.getElementById('usernameInput').value = '';
      document.getElementById('emailInput').value = '';
      document.getElementById('passwordInput').value = '';

      showAuthMessage('');
    }

    function validPassword(password) {
      return (
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /\d/.test(password)
      );
    }

    function signUp() {
      const username = document.getElementById('usernameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;

      if (!username || !email || !password) {
        showAuthMessage('Please complete all fields.');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAuthMessage('Enter a valid email address.');
        return;
      }
      if (/\s/.test(username)) {
        showAuthMessage('Username cannot contain spaces.');
        return;
      }
      if (!validPassword(password)) {
        showAuthMessage('Password needs 8 characters, uppercase, lowercase, and a number.');
        return;
      }

      showLoader('Creating your account...');

      try {
        const pool = getCognitoPool();

        const attributes = [
          new AmazonCognitoIdentity.CognitoUserAttribute({
            Name: 'email',
            Value: email
          })
        ];

        pool.signUp(
          username,
          password,
          attributes,
          null,
          (error, result) => {
            hideLoader();

            if (error) {
              showAuthMessage(error.message || 'Sign-up failed.');
              return;
            }

            if (result.userConfirmed) {
              toggleAuthMode();
              showAuthMessage('Account created. You can now log in.', true);
              return;
            }
            pendingUser = result.user;
            document.getElementById('confirmationModal').classList.remove('hidden');
            document.getElementById('confirmationModal').classList.add('flex');
          }
        );
      } catch (error) {
        hideLoader();
        showAuthMessage(error.message);
      }
    }

    function signIn() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!username || !password) {
        showAuthMessage('Please enter your username/email and password.');
        return;
      }

      showLoader('Signing you in...');

      try {
        const pool = getCognitoPool();

        const details =
          new AmazonCognitoIdentity.AuthenticationDetails({
            Username: username,
            Password: password
          });

        const cognitoUser =
          new AmazonCognitoIdentity.CognitoUser({
            Username: username,
            Pool: pool
          });

        cognitoUser.authenticateUser(details, {
          onSuccess(session) {
            hideLoader();

            sessionStorage.setItem(
              'crushx_access_token',
              session.getAccessToken().getJwtToken()
            );

            sessionStorage.setItem(
              'crushx_id_token',
              session.getIdToken().getJwtToken()
            );

            document.getElementById('authOverlay').style.display = 'none';
            renderApp();
          },

          onFailure(error) {
            hideLoader();
            if (error.code === 'UserNotConfirmedException') {
              pendingUser = cognitoUser;
              document.getElementById('confirmationModal').classList.remove('hidden');
              document.getElementById('confirmationModal').classList.add('flex');
            }
            showAuthMessage(error.message || 'Login failed.');
          },

          newPasswordRequired() { hideLoader(); showAuthMessage('This account requires a new password. Use Forgot password to reset it.'); },
          customChallenge() { hideLoader(); showAuthMessage('This account requires an unsupported authentication challenge. Contact support.'); },
          selectMFAType() { hideLoader(); showAuthMessage('MFA selection is not configured in this frontend. Contact support.'); },
          mfaSetup() { hideLoader(); showAuthMessage('MFA setup is not configured in this frontend. Contact support.'); },
          totpRequired() { hideLoader(); showAuthMessage('Authenticator MFA is not configured in this frontend. Contact support.'); },
          mfaRequired() {
            hideLoader();

            const code = prompt('Enter your MFA code:');

            if (!code) return;

            showLoader('Verifying MFA...');

            cognitoUser.sendMFACode(code, {
              onSuccess(session) {
                hideLoader();

                sessionStorage.setItem(
                  'crushx_access_token',
                  session.getAccessToken().getJwtToken()
                );

                document.getElementById('authOverlay').style.display = 'none';
                renderApp();
              },

              onFailure(error) {
                hideLoader();
                showAuthMessage(error.message || 'MFA verification failed.');
              }
            });
          }
        });
      } catch (error) {
        hideLoader();
        showAuthMessage(error.message);
      }
    }

    function handleAuthAction() {
      if (document.getElementById('loader').classList.contains('show')) return;
      showAuthMessage('');
      if (recoveryMode === 'forgot') return requestReset();
      if (recoveryMode === 'reset') return resetPassword();
      signUpMode ? signUp() : signIn();
    }

    function confirmAccount() {
      const code = document.getElementById('confirmationCode').value.trim();

      if (!pendingUser || !/^\d{6}$/.test(code)) {
        document.getElementById('confirmationMessage').textContent = 'Enter the six-digit verification code.';
        return;
      }

      showLoader('Confirming account...');

      pendingUser.confirmRegistration(code, true, error => {
        hideLoader();

        if (error) {
          document.getElementById('confirmationMessage').textContent = error.message || 'Verification failed.';
          return;
        }

        document.getElementById('confirmationModal').classList.add('hidden');
        document.getElementById('confirmationModal').classList.remove('flex');

        pendingUser = null;
        signUpMode = true;
        toggleAuthMode();
        showAuthMessage('Account verified. You can now log in.', true);
      });
    }

    function resendCode() {
      if (!pendingUser) return;

      showLoader('Resending verification code...');

      pendingUser.resendConfirmationCode(error => {
        hideLoader();

        if (error) {
          document.getElementById('confirmationMessage').textContent = error.message || 'Could not resend code.';
          return;
        }

        document.getElementById('confirmationMessage').textContent = 'A new verification code was sent.';
      });
    }

    function restoreSession() {
      try {
        const pool = getCognitoPool();
        const user = pool.getCurrentUser();

        if (!user) return;

        user.getSession((error, session) => {
          if (error || !session || !session.isValid()) return;

          sessionStorage.setItem(
            'crushx_access_token',
            session.getAccessToken().getJwtToken()
          );

          document.getElementById('authOverlay').style.display = 'none';
          renderApp();
        });
      } catch {
        // The login screen remains visible.
      }
    }

    function logout() {
      try {
        getCognitoPool().getCurrentUser()?.signOut();
      } catch {}

      sessionStorage.removeItem('crushx_access_token');
      sessionStorage.removeItem('crushx_id_token');
      document.getElementById('authOverlay').style.display = 'flex';
      renderApp();
    }

    // No verified publishing contract or approved upload destination is present.
    // Keep this guard even when invoked outside the Create screen.
    async function uploadToS3(file) {
      try { validateMedia(file); }
      catch (error) { alert(error.message); return; }
      alert('Publishing unavailable: the upload destination and backend contract have not been verified. No file was uploaded.');
    }

    function validateMedia(file) {
      if (!file || !['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'video/mp4', 'video/webm'].includes(file.type)) {
        throw new Error('Choose a JPEG, PNG, WebP, GIF, MP4 or WebM file.');
      }
      if (!file.size || file.size > 100 * 1024 * 1024) throw new Error('File must be between 1 byte and 100 MB.');
    }

    function validateUploadResponse(data) {
      if (!data || typeof data.uploadUrl !== 'string' || typeof data.mediaUrl !== 'string') throw new Error('Upload response requires uploadUrl and mediaUrl.');
      for (const value of [data.uploadUrl, data.mediaUrl]) {
        const url = new URL(value);
        if (url.protocol !== 'https:' || url.username || url.password) throw new Error('Upload and media URLs must use HTTPS without embedded credentials.');
      }
      // Shape validation does not authorize a destination; publishing remains blocked.
      return data;
    }

          ${tabs.map(([id, label, icon]) => `
            <button
              data-tab="${id}"
              class="tab-button flex min-w-[58px] flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold ${
                state.activeTab === id
                  ? 'gradient-main text-white'
                  : 'text-slate-500 dark:text-slate-300'

            >

          `).join('')}

      bindAppEvents();

    function bindAppEvents() {
      bindRepairEvents();
      document.querySelectorAll('[data-tab]').forEach(button => {
        button.addEventListener('click', () => {
          navigate(button.dataset.tab);
        });
      });

      document.getElementById('themeButton')?.addEventListener('click', () => {
        const state = getState();
        state.darkMode = !state.darkMode;
        saveState(state);
        renderApp();
      });

      document.getElementById('profileButton')?.addEventListener('click', () => {
        navigate('profile');
      });

      document.getElementById('logoutButton')?.addEventListener('click', logout);

      document.getElementById('searchInput')?.addEventListener('input', event => {
        const state = getState();
        state.searchQuery = event.target.value;
        saveState(state);
        renderApp();
      });

      document.querySelectorAll('[data-follow-user]').forEach(button => {
        button.addEventListener('click', () => {
          const state = getState();
          const user = state.users.find(item => item.id === button.dataset.followUser);

          if (!user) return;

          user.following = !user.following;
          user.followers = Math.max(
            0,
            Number(user.followers) + (user.following ? 1 : -1)
          );

          saveState(state);
          renderApp();
        });
      });

      document.querySelectorAll('[data-comment-send]').forEach(button => {
        button.addEventListener('click', () => {
          const postId = button.dataset.commentSend;
          const input = [...document.querySelectorAll('[data-comment-input]')].find(element => element.dataset.commentInput === postId);
          const text = input?.value.trim();

          if (!text) return;

          const state = getState();
          const post = [...state.posts, ...state.reels].find(item => item.id === postId);
          const user = currentUser(state);

          if (!post) return;

          if (!Array.isArray(post.comments)) post.comments = [];
          post.comments.push({
            user: user.username,
            text: text.slice(0, 2000)
          });

          saveState(state);
          renderApp();
        });
      });

      const mediaInput = document.getElementById('mediaInput');
      const preview = document.getElementById('mediaPreview');

      mediaInput?.addEventListener('change', () => {
        const file = mediaInput.files?.[0];

        if (!file || !preview) return;

        try { validateMedia(file); } catch (error) { mediaInput.value = ''; preview.classList.add('hidden'); preview.innerHTML = ''; if (previewUrl) URL.revokeObjectURL(previewUrl); previewUrl = null; alert(error.message); return; }
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        const objectUrl = previewUrl = URL.createObjectURL(file);

        preview.classList.remove('hidden');
        preview.innerHTML = file.type.startsWith('video/')
          ? `<video src="${objectUrl}" controls class="max-h-96 w-full object-cover"></video>`
          : `<img src="${objectUrl}" alt="Media preview" class="max-h-96 w-full object-cover" />`;
      });

      document.getElementById('uploadButton')?.addEventListener('click', () => {
        const file = mediaInput?.files?.[0];
        const caption = document.getElementById('captionInput')?.value.trim();

        if (!file) {
          alert('Select an image or video first.');
          return;
        }

        uploadToS3(file, caption);
      });
    }

    function beginRecovery() {
      recoveryMode = 'forgot';
      signUpMode = false;
      showAuthMessage('');
      document.getElementById('authTitle').textContent = 'Reset your password';
      document.getElementById('authDescription').textContent = 'Enter your username or email to request a reset code.';
      document.getElementById('authButton').textContent = 'Send reset code';
      document.getElementById('switchAuthButton').textContent = 'Back to login';
      document.getElementById('forgotButton').classList.add('hidden');
      document.getElementById('emailInput').classList.add('hidden');
      document.getElementById('passwordInput').classList.add('hidden');
      document.getElementById('passwordInput').value = '';
    }

    function requestReset() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) return showAuthMessage('Enter your username or email.');
      try {
        const pool = getCognitoPool();
        recoveryUser = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: pool });
        showLoader('Requesting reset code...');
        const ready = () => {
          hideLoader();
          recoveryMode = 'reset';
          document.getElementById('usernameInput').readOnly = true;
          document.getElementById('authButton').textContent = 'Reset password';
          document.getElementById('authDescription').textContent = 'Enter the code and a new password. Password needs 8 characters, uppercase, lowercase and a number; Cognito enforces the pool policy.';
          document.getElementById('resetCodeInput').classList.remove('hidden');
          document.getElementById('passwordInput').classList.remove('hidden');
          document.getElementById('passwordInput').autocomplete = 'new-password';
          document.getElementById('passwordInput').placeholder = 'New password';
          showAuthMessage('If the account can be recovered, a reset code has been sent.', true);
          document.getElementById('resetCodeInput').focus();
        };
        recoveryUser.forgotPassword({ onSuccess: ready, inputVerificationCode: ready, onFailure(error) { hideLoader(); showAuthMessage(error.message || 'Could not request a reset code.'); } });
      } catch (error) { hideLoader(); showAuthMessage(error.message); }
    }

    function resetPassword() {
      const code = document.getElementById('resetCodeInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!recoveryUser || !/^\d{6}$/.test(code)) return showAuthMessage('Enter the six-digit reset code.');
      if (!validPassword(password)) return showAuthMessage('Password needs 8 characters, uppercase, lowercase and a number.');
      showLoader('Resetting password...');
      try {
        recoveryUser.confirmPassword(code, password, {
          onSuccess() { hideLoader(); toggleAuthMode(); document.getElementById('passwordInput').placeholder = 'Password'; showAuthMessage('Password reset. Log in with your new password.', true); },
          onFailure(error) { hideLoader(); showAuthMessage(error.message || 'Password reset failed.'); }
        });
      } catch (error) { hideLoader(); showAuthMessage(error.message); }
    }

    const validTabs = ['home', 'messages', 'create', 'discover', 'reels', 'profile'];
    function navigate(tab, chatUserId = null, push = true) {
      if (!validTabs.includes(tab)) tab = 'home';
      const state = getState();
      state.activeTab = tab;
      state.chatUserId = tab === 'messages' ? chatUserId : null;
      saveState(state);
      const hash = `#${tab}${state.chatUserId ? '/' + encodeURIComponent(state.chatUserId) : ''}`;
      if (push && location.hash !== hash) history.pushState(null, '', hash);
      renderApp();
      window.scrollTo(0, 0);
    }
    function routeFromLocation() {
      const [tab, user] = location.hash.slice(1).split('/');
      let chat = null;
      try { chat = user ? decodeURIComponent(user) : null; } catch {}
      navigate(tab || 'home', chat, false);
    }
    window.addEventListener('popstate', routeFromLocation);
    window.addEventListener('hashchange', routeFromLocation);

    function bindRepairEvents() {
      const status = text => { const element = document.getElementById('appStatus'); if (element) element.textContent = text; };
      document.querySelectorAll('[data-like], [data-save]').forEach(button => button.addEventListener('click', () => {
        const state = getState();
        const item = [...state.posts, ...state.reels].find(p => p.id === (button.dataset.like || button.dataset.save));
        if (!item) return;
        if (button.dataset.like) { item.liked = !item.liked; item.likes = Math.max(0, Number(item.likes || 0) + (item.liked ? 1 : -1)); }
        else item.saved = !item.saved;
        saveState(state); renderApp(); status('Saved in this browser only.');
      }));
      document.querySelectorAll('[data-comment-focus]').forEach(button => button.addEventListener('click', () => {
        const input = [...document.querySelectorAll('[data-comment-input]')].find(e => e.dataset.commentInput === button.dataset.commentFocus);
        input?.focus(); input?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }));
      document.querySelectorAll('[data-comment-input]').forEach(input => input.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); [...document.querySelectorAll('[data-comment-send]')].find(b => b.dataset.commentSend === input.dataset.commentInput)?.click(); }
      }));
      document.querySelectorAll('[data-share]').forEach(button => button.addEventListener('click', async () => {
        const state = getState();
        const item = [...state.posts, ...state.reels].find(p => p.id === button.dataset.share);
        if (!item) return;
        // Share the actual media URL; sample items have no public post permalink.
        const url = safeMediaUrl(item.source || item.image) ? new URL(item.source || item.image).href : '';
        if (!url) return status('No shareable media URL.');
        try {
          if (navigator.share) { await navigator.share({ title: 'Crush.X', text: item.caption, url }); status('Share completed.'); }
          else if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(url); status('Media link copied.'); }
          else window.prompt('Copy this media link:', url);
        } catch (error) { if (error.name !== 'AbortError') status('Sharing failed. Please try again.'); }
      }));
      document.querySelectorAll('[data-chat-user]').forEach(button => button.addEventListener('click', () => navigate('messages', button.dataset.chatUser)));
      document.getElementById('messagesBack')?.addEventListener('click', () => navigate('messages'));
      document.getElementById('messageDraft')?.addEventListener('input', event => {
        const state = getState(); state.messageDrafts ||= {}; state.messageDrafts[state.chatUserId] = event.target.value.slice(0, 4000); saveState(state);
      });
    }

    document.getElementById('cancelConfirmation').addEventListener('click', () => { document.getElementById('confirmationModal').classList.add('hidden'); document.getElementById('confirmationModal').classList.remove('flex'); pendingUser = null; signUpMode = true; toggleAuthMode(); });
    document.getElementById('authForm').addEventListener('submit', event => { event.preventDefault(); handleAuthAction(); });
    document.getElementById('switchAuthButton').addEventListener('click', toggleAuthMode);
    document.getElementById('confirmButton').addEventListener('click', confirmAccount);
    document.getElementById('resendButton').addEventListener('click', resendCode);

    document.getElementById('forgotButton').addEventListener('click', beginRecovery);

    document.addEventListener('DOMContentLoaded', () => {
      routeFromLocation();
      restoreSession();
    });
  </script>
</body>
</html>
