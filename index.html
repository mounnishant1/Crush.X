<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crush.X</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #fff7fc;
      --card: rgba(255,255,255,.84);
      --strong: rgba(255,255,255,.97);
      --text: #171b2e;
      --muted: #64748b;
      --line: rgba(148,163,184,.18);
      --shadow: rgba(124,58,237,.12);
    }

    .dark {
      --bg: #090d18;
      --card: rgba(15,23,42,.88);
      --strong: rgba(17,24,39,.98);
      --text: #edf3ff;
      --muted: #9aa9c5;
      --line: rgba(148,163,184,.18);
      --shadow: rgba(2,6,23,.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255,79,163,.14), transparent 20%),
        radial-gradient(circle at top right, rgba(124,58,237,.15), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .glass {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 14px 32px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .glass-strong {
      background: var(--strong);
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .gradient-main {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed 52%, #38bdf8);
    }

    .text-gradient {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .story-ring {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed, #38bdf8);
      padding: 2px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 30;
      width: min(94vw, 560px);
      transform: translateX(-50%);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(10px);
    }

    .loader.show {
      display: flex;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 700px) {
      .desktop-nav {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Login and signup -->
  <div id="authOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xl">
    <div class="glass-strong w-full max-w-md rounded-[2rem] p-6">
      <div class="text-center">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl gradient-main text-3xl font-black text-white">
          C
        </div>

        <h1 id="authTitle" class="mt-4 text-3xl font-black text-gradient">
          Welcome to Crush.X
        </h1>

        <p id="authDescription" class="mt-2 text-sm text-slate-500">
          Find your vibe. Match your mood.
        </p>
      </div>

      <div class="mt-6 space-y-3">
        <input
          id="usernameInput"
          type="text"
          autocomplete="username"
          placeholder="Username or email"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />

        <input
          id="emailInput"
          type="email"
          autocomplete="email"
          placeholder="Email address"
          class="hidden w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />

        <input
          id="passwordInput"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />
      </div>

      <button
        id="authButton"
        class="mt-5 w-full rounded-2xl gradient-main px-4 py-3.5 text-sm font-bold text-white"
      >
        Login
      </button>

      <div class="mt-5 flex justify-between text-sm">
        <button id="switchAuthButton" class="font-bold text-pink-600">
          Create account
        </button>

        <button id="forgotButton" class="font-semibold text-slate-500">
          Forgot password?
        </button>
      </div>

      <div id="authMessage" class="mt-4 hidden rounded-2xl p-3 text-center text-xs font-bold"></div>
    </div>
  </div>

  <!-- Account confirmation -->
  <div id="confirmationModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xl">
    <div class="glass-strong w-full max-w-md rounded-[2rem] p-6">
      <h2 class="text-2xl font-black">Verify your account</h2>
      <p class="mt-2 text-sm text-slate-500">
        Enter the verification code sent to your email.
      </p>

      <input
        id="confirmationCode"
        maxlength="6"
        inputmode="numeric"
        placeholder="Verification code"
        class="mt-5 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-center text-xl tracking-[.5em] outline-none dark:border-slate-700 dark:bg-slate-900"
      />

      <button
        id="confirmButton"
        class="mt-4 w-full rounded-2xl gradient-main px-4 py-3 font-bold text-white"
      >
        Verify account
      </button>

      <button
        id="resendButton"
        class="mt-4 w-full text-sm font-bold text-pink-600"
      >
        Resend code
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loader" class="loader">
    <div class="text-center text-white">
      <div class="spinner mx-auto"></div>
      <div id="loaderText" class="mt-4 text-sm font-bold">Please wait...</div>
    </div>
  </div>

  <div id="app" class="min-h-screen"></div>

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function getState() {
      const saved = localStorage.getItem(STATE_KEY);

      if (!saved) {
        localStorage.setItem(STATE_KEY, JSON.stringify(defaultState));
        return clone(defaultState);
      }

      try {
        return {
          ...clone(defaultState),
          ...JSON.parse(saved)
        };
      } catch {
        localStorage.setItem(STATE_KEY, JSON.stringify(defaultState));
        return clone(defaultState);
      }
    }

    function saveState(state) {
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }

    function currentUser(state) {
      return state.users.find(user => user.id === state.currentUserId) || state.users[0];
    }

    function userById(state, id) {
      return state.users.find(user => user.id === id);
    }

    function escapeHTML(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatText(value = '') {
      return escapeHTML(value).replace(
        /(@[a-zA-Z0-9_.]+)/g,
        '<span class="font-bold text-pink-500">$1</span>'
      );
    }

    function showLoader(message) {
      document.getElementById('loaderText').textContent = message;
      document.getElementById('loader').classList.add('show');
    }

    function hideLoader() {
      document.getElementById('loader').classList.remove('show');
    }

    function showAuthMessage(message, success = false) {
      const element = document.getElementById('authMessage');

      if (!message) {
        element.className = 'hidden';
        return;
      }

      element.textContent = message;
      element.className = success
        ? 'mt-4 rounded-2xl bg-emerald-100 p-3 text-center text-xs font-bold text-emerald-700'
        : 'mt-4 rounded-2xl bg-red-100 p-3 text-center text-xs font-bold text-red-700';
    }

    function getCognitoPool() {
      if (!window.AmazonCognitoIdentity) {
        throw new Error('Cognito SDK failed to load.');
      }

      if (!cognitoPool) {
        cognitoPool =
          new AmazonCognitoIdentity.CognitoUserPool(COGNITO_CONFIG);
      }

      return cognitoPool;
    }

    function toggleAuthMode() {
      signUpMode = !signUpMode;

      document.getElementById('authTitle').textContent =
        signUpMode ? 'Create Account' : 'Welcome to Crush.X';

      document.getElementById('authDescription').textContent =
        signUpMode
          ? 'Join the Crush.X community.'
          : 'Find your vibe. Match your mood.';

      document.getElementById('authButton').textContent =
        signUpMode ? 'Register' : 'Login';

      document.getElementById('switchAuthButton').textContent =
        signUpMode ? 'Already have an account?' : 'Create account';

      document.getElementById('emailInput').classList.toggle(
        'hidden',
        !signUpMode
      );

      document.getElementById('forgotButton').classList.toggle(
        'hidden',
        signUpMode
      );

      document.getElementById('usernameInput').placeholder =
        signUpMode ? 'Choose a username' : 'Username or email';

      document.getElementById('usernameInput').value = '';
      document.getElementById('emailInput').value = '';
      document.getElementById('passwordInput').value = '';

      showAuthMessage('');
    }

    function validPassword(password) {
      return (
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /\d/.test(password)
      );
    }

    function signUp() {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;

      if (!username || !email || !password) {
        showAuthMessage('Please complete all fields.');
        return;
      }

      if (!validPassword(password)) {
        showAuthMessage('Password needs 8 characters, uppercase, lowercase, and a number.');
        return;
      }

      showLoader('Creating your account...');

      try {
        const pool = getCognitoPool();

        const attributes = [
          new AmazonCognitoIdentity.CognitoUserAttribute({
            Name: 'email',
            Value: email
          })
        ];

        pool.signUp(
          username,
          password,
          attributes,
          null,
          (error, result) => {
            hideLoader();

            if (error) {
              showAuthMessage(error.message || 'Sign-up failed.');
              return;
            }

            pendingUser = result.user;
            document.getElementById('confirmationModal').classList.remove('hidden');
            document.getElementById('confirmationModal').classList.add('flex');
          }
        );
      } catch (error) {
        hideLoader();
        showAuthMessage(error.message);
      }
    }

    function signIn() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!username || !password) {
        showAuthMessage('Please enter your username/email and password.');
        return;
      }

      showLoader('Signing you in...');

      try {
        const pool = getCognitoPool();

        const details =
          new AmazonCognitoIdentity.AuthenticationDetails({
            Username: username,
            Password: password
          });

        const cognitoUser =
          new AmazonCognitoIdentity.CognitoUser({
            Username: username,
            Pool: pool
          });

        cognitoUser.authenticateUser(details, {
          onSuccess(session) {
            hideLoader();

            sessionStorage.setItem(
              'crushx_access_token',
              session.getAccessToken().getJwtToken()
            );

            sessionStorage.setItem(
              'crushx_id_token',
              session.getIdToken().getJwtToken()
            );

            document.getElementById('authOverlay').style.display = 'none';
            renderApp();
          },

          onFailure(error) {
            hideLoader();
            showAuthMessage(error.message || 'Login failed.');
          },

          mfaRequired() {
            hideLoader();

            const code = prompt('Enter your MFA code:');

            if (!code) return;

            showLoader('Verifying MFA...');

            cognitoUser.sendMFACode(code, {
              onSuccess(session) {
                hideLoader();

                sessionStorage.setItem(
                  'crushx_access_token',
                  session.getAccessToken().getJwtToken()
                );

                document.getElementById('authOverlay').style.display = 'none';
                renderApp();
              },

              onFailure(error) {
                hideLoader();
                showAuthMessage(error.message || 'MFA verification failed.');
              }
            });
          }
        });
      } catch (error) {
        hideLoader();
        showAuthMessage(error.message);
      }
    }

    function handleAuthAction() {
      signUpMode ? signUp() : signIn();
    }

    function confirmAccount() {
      const code = document.getElementById('confirmationCode').value.trim();

      if (!pendingUser || !code) {
        alert('Enter the verification code.');
        return;
      }

      showLoader('Confirming account...');

      pendingUser.confirmRegistration(code, true, error => {
        hideLoader();

        if (error) {
          alert(error.message || 'Verification failed.');
          return;
        }

        document.getElementById('confirmationModal').classList.add('hidden');
        document.getElementById('confirmationModal').classList.remove('flex');

        alert('Account verified. You can now log in.');
        toggleAuthMode();
      });
    }

    function resendCode() {
      if (!pendingUser) return;

      showLoader('Resending verification code...');

      pendingUser.resendConfirmationCode(error => {
        hideLoader();

        if (error) {
          alert(error.message || 'Could not resend code.');
          return;
        }

        alert('A new verification code was sent.');
      });
    }

    function restoreSession() {
      try {
        const pool = getCognitoPool();
        const user = pool.getCurrentUser();

        if (!user) return;

        user.getSession((error, session) => {
          if (error || !session || !session.isValid()) return;

          sessionStorage.setItem(
            'crushx_access_token',
            session.getAccessToken().getJwtToken()
          );

          document.getElementById('authOverlay').style.display = 'none';
          renderApp();
        });
      } catch {
        // The login screen remains visible.
      }
    }

    function logout() {
      try {
        getCognitoPool().getCurrentUser()?.signOut();
      } catch {}

      sessionStorage.clear();
      document.getElementById('authOverlay').style.display = 'flex';
      renderApp();
    }

    async function uploadToS3(file, caption) {
      const token = sessionStorage.getItem('crushx_access_token');

      if (!token) {
        alert('Please sign in before uploading.');
        return;
      }

      if (API_BASE_URL.includes('YOUR_API_ID')) {
        alert('Replace API_BASE_URL with your API Gateway URL first.');
        return;
      }

      if (file.size > 100 * 1024 * 1024) {
        alert('Maximum file size is 100 MB.');
        return;
      }

      if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
        alert('Only image and video files are supported.');
        return;
      }

      try {
        showLoader('Creating secure upload URL...');

        const urlResponse = await fetch(
          `${API_BASE_URL}/media/upload-url`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              fileName: file.name,
              contentType: file.type,
              fileSize: file.size
            })
          }
        );

        if (!urlResponse.ok) {
          throw new Error('Could not create the upload URL.');
        }

        const uploadData = await urlResponse.json();

        if (!uploadData.uploadUrl) {
          throw new Error('The API did not return uploadUrl.');
        }

        showLoader('Uploading media to S3...');

        const s3Response = await fetch(uploadData.uploadUrl, {
          method: 'PUT',
          headers: {
            'Content-Type': file.type
          },
          body: file
        });

        if (!s3Response.ok) {
          throw new Error('S3 upload failed.');
        }

        const state = getState();

        state.reels.unshift({
          id: `reel_${Date.now()}`,
          userId: state.currentUserId,
          source: uploadData.mediaUrl,
          caption: caption || 'New Crush.X upload ✨',
          likes: 0,
          comments: 0,
          shares: 0,
          song: 'Original audio',
          artist: '',
          createdAt: Date.now()
        });

        saveState(state);
        hideLoader();
        renderApp();

        alert('Media uploaded successfully.');
      } catch (error) {
        hideLoader();
        console.error(error);
        alert(error.message || 'Upload failed.');
      }
    }

    function renderHome(state) {
      return `
        <main class="space-y-5">
          <section class="glass rounded-[2rem] p-3">
            <div class="flex gap-4 overflow-x-auto">
              ${state.stories
                .filter(story => story.expiresAt > Date.now())
                .map(story => {
                  const user = userById(state, story.userId);

                  return `
                    <div class="min-w-[76px] text-center">
                      <div class="story-ring rounded-full">
                        <img src="${user.avatar}" class="h-16 w-16 rounded-full border-2 border-white object-cover" />
                      </div>
                      <div class="mt-2 truncate text-[10px] font-bold text-slate-500">
                        ${user.username.slice(0, 9)}
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>
          </section>

          ${state.posts.map(post => {
            const author = userById(state, post.userId);

            return `
              <article class="glass rounded-[2rem] p-3 sm:p-4">
                <div class="mb-3 flex items-center gap-3">
                  <img src="${author.avatar}" class="h-11 w-11 rounded-full object-cover ring-2 ring-pink-200" />

                  <div>
                    <div class="flex items-center gap-1 font-bold">
                      @${author.username}
                      ${author.verified ? '<i data-lucide="badge-check" class="h-4 w-4 text-blue-500"></i>' : ''}
                    </div>
                    <div class="text-xs text-slate-500">${post.location}</div>
                  </div>
                </div>

                <img src="${post.image}" class="h-[420px] w-full rounded-[1.7rem] object-cover" />

                <div class="mt-3 flex justify-between">
                  <div class="flex gap-4">
                    <button><i data-lucide="heart" class="h-5 w-5"></i></button>
                    <button><i data-lucide="message-circle" class="h-5 w-5"></i></button>
                    <button><i data-lucide="send" class="h-5 w-5"></i></button>
                  </div>
                  <button><i data-lucide="bookmark" class="h-5 w-5"></i></button>
                </div>

                <div class="mt-3 text-sm font-bold">
                  ${Number(post.likes).toLocaleString()} likes
                  <span class="ml-2 font-normal text-slate-500">
                    ${Number(post.shares).toLocaleString()} shares
                  </span>
                </div>

                <div class="mt-2 text-sm">
                  <strong>@${author.username}</strong>
                  <span class="text-slate-600 dark:text-slate-300">
                    ${formatText(post.caption)}
                  </span>
                </div>

                <div class="mt-3 space-y-2">
                  ${post.comments.map(comment => `
                    <div class="rounded-2xl bg-slate-100 px-3 py-2 text-sm dark:bg-slate-800">
                      <strong>@${escapeHTML(comment.user)}</strong>
                      <span class="text-slate-600 dark:text-slate-300">
                        ${escapeHTML(comment.text)}
                      </span>
                    </div>
                  `).join('')}
                </div>

                <div class="mt-3 flex gap-2">
                  <input
                    data-comment-input="${post.id}"
                    placeholder="Add a comment..."
                    class="flex-1 rounded-full border border-slate-200 bg-slate-100 px-4 py-2 text-sm outline-none dark:border-slate-700 dark:bg-slate-800"
                  />

                  <button
                    data-comment-send="${post.id}"
                    class="rounded-full gradient-main px-4 py-2 text-sm font-bold text-white"
                  >
                    Send
                  </button>
                </div>
              </article>
            `;
          }).join('')}
        </main>
      `;
    }

    function renderDiscover(state) {
      const query = state.searchQuery.toLowerCase();

      const filteredUsers = state.users.filter(user => {
        const text =
          `${user.username} ${user.fullName} ${user.info}`.toLowerCase();

        return text.includes(query);
      });

      return `
        <main>
          <section class="glass rounded-[2rem] p-4">
            <div class="mb-4">
              <div class="text-xs font-bold uppercase tracking-[.2em] text-pink-500">
                Discover
              </div>

              <h1 class="mt-1 text-2xl font-black">
                Find your vibe
              </h1>

              <p class="mt-1 text-sm text-slate-500">
                Search people, places, food, and songs.
              </p>
            </div>

            <div class="relative">
              <i data-lucide="search" class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></i>

              <input
                id="searchInput"
                value="${escapeHTML(state.searchQuery)}"
                placeholder="Search people, places, songs..."
                class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-3 pl-12 pr-4 text-sm outline-none focus:border-pink-500 dark:border-slate-700 dark:bg-slate-800"
              />
            </div>

            <div class="mt-4 space-y-3">
              ${filteredUsers.length ? filteredUsers.map(user => `
                <article class="flex items-center gap-3 rounded-[1.5rem] border border-slate-100 bg-white p-3 dark:border-slate-700 dark:bg-slate-900">
                  <img src="${user.avatar}" class="h-14 w-14 rounded-full object-cover ring-2 ring-pink-200" />

                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1 font-bold">
                      @${escapeHTML(user.username)}
                      ${user.verified ? '<i data-lucide="badge-check" class="h-4 w-4 text-blue-500"></i>' : ''}
                    </div>

                    <div class="truncate text-sm text-slate-500">
                      ${escapeHTML(user.fullName)}
                    </div>

                    <div class="truncate text-xs text-slate-400">
                      ${escapeHTML(user.info)}
                    </div>

                    <div class="mt-1 text-[11px] font-bold text-pink-500">
                      ${Number(user.followers).toLocaleString()} followers
                    </div>
                  </div>

                  ${
                    user.id === state.currentUserId
                      ? '<span class="rounded-full bg-pink-50 px-3 py-2 text-xs font-bold text-pink-600">You</span>'
                      : `
                        <button
                          data-follow-user="${user.id}"
                          class="${user.following ? 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200' : 'gradient-main text-white'} rounded-full px-3 py-2 text-xs font-bold"
                        >
                          ${user.following ? 'Following' : 'Follow'}
                        </button>
                      `
                  }
                </article>
              `).join('') : `
                <div class="rounded-2xl bg-slate-100 p-8 text-center dark:bg-slate-800">
                  <div class="text-4xl">🔍</div>
                  <div class="mt-3 font-bold">No users found</div>
                  <div class="mt-1 text-sm text-slate-500">Try another search.</div>
                </div>
              `}
            </div>
          </section>
        </main>
      `;
    }

    function renderCreate() {
      return `
        <main>
          <section class="glass rounded-[2rem] p-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xs font-bold uppercase tracking-[.2em] text-pink-500">
                  Create
                </div>
                <h1 class="mt-1 text-2xl font-black">Upload media</h1>
              </div>

              <label class="cursor-pointer rounded-2xl gradient-main px-4 py-3 text-xs font-bold text-white">
                Select file
                <input id="mediaInput" type="file" accept="image/*,video/*" class="hidden" />
              </label>
            </div>

            <div id="mediaPreview" class="mt-5 hidden overflow-hidden rounded-[2rem]"></div>

            <textarea
              id="captionInput"
              rows="4"
              placeholder="Write a caption..."
              class="mt-5 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none dark:border-slate-700 dark:bg-slate-800"
            ></textarea>

            <button
              id="uploadButton"
              class="mt-4 w-full rounded-2xl gradient-main px-4 py-3 text-sm font-bold text-white"
            >
              Upload securely to S3
            </button>

            <p class="mt-3 text-center text-xs text-slate-500">
              Private S3 upload using a pre-signed URL.
            </p>
          </section>
        </main>
      `;
    }

    function renderReels(state) {
      const reel = state.reels[0];
      const creator = userById(state, reel.userId);

      return `
        <main>
          <section class="mx-auto max-w-md">
            <div class="relative h-[calc(100vh-150px)] overflow-hidden rounded-[2rem] bg-black">
              <img src="${reel.source}" class="h-full w-full object-cover" />
              <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>

              <div class="absolute bottom-0 left-0 right-0 p-5 text-white">
                <div class="mb-3 flex items-center gap-3">
                  <img src="${creator.avatar}" class="h-11 w-11 rounded-full object-cover ring-2 ring-white" />

                  <div>
                    <div class="flex items-center gap-1 font-bold">
                      @${creator.username}
                      ${creator.verified ? '<i data-lucide="badge-check" class="h-4 w-4 text-blue-400"></i>' : ''}
                    </div>

                    <div class="text-xs text-white/70">
                      ${Number(creator.followers).toLocaleString()} followers
                    </div>
                  </div>

                  <button class="ml-auto rounded-full bg-pink-500 px-4 py-2 text-xs font-bold">
                    Follow
                  </button>
                </div>

                <div class="text-sm">${formatText(reel.caption)}</div>

                <div class="mt-2 flex items-center gap-2 text-xs text-white/80">
                  <i data-lucide="music-2" class="h-4 w-4"></i>
                  ${escapeHTML(reel.song)} · ${escapeHTML(reel.artist)}
                </div>
              </div>

              <div class="absolute bottom-28 right-4 flex flex-col gap-4 text-center text-white">
                <button>
                  <i data-lucide="heart" class="mx-auto h-7 w-7"></i>
                  <span class="text-[10px]">${Number(reel.likes).toLocaleString()}</span>
                </button>

                <button>
                  <i data-lucide="message-circle" class="mx-auto h-7 w-7"></i>
                  <span class="text-[10px]">${Number(reel.comments).toLocaleString()}</span>
                </button>

                <button>
                  <i data-lucide="send" class="mx-auto h-7 w-7"></i>
                  <span class="text-[10px]">${Number(reel.shares).toLocaleString()}</span>
                </button>
              </div>
            </div>
          </section>
        </main>
      `;
    }

    function renderMessages(state) {
      return `
        <main>
          <section class="glass rounded-[2rem] p-4">
            <h1 class="text-2xl font-black">Messages</h1>

            <div class="mt-5 space-y-3">
              ${state.users
                .filter(user => user.id !== state.currentUserId)
                .map(user => `
                  <button class="flex w-full items-center gap-3 rounded-2xl bg-slate-100 p-3 text-left dark:bg-slate-800">
                    <img src="${user.avatar}" class="h-12 w-12 rounded-full object-cover" />
                    <div class="flex-1">
                      <div class="font-bold">@${user.username}</div>
                      <div class="text-xs text-slate-500">Send a message ✨</div>
                    </div>
                    <i data-lucide="chevron-right" class="h-5 w-5 text-slate-400"></i>
                  </button>
                `)
                .join('')}
            </div>
          </section>
        </main>
      `;
    }

    function renderProfile(state) {
      const user = currentUser(state);

      return `
        <main>
          <section class="glass rounded-[2rem] p-5">
            <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
              <img src="${user.avatar}" class="h-24 w-24 rounded-full object-cover ring-4 ring-pink-200" />

              <div class="flex-1">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-1 text-2xl font-black">
                      @${user.username}
                      ${user.verified ? '<i data-lucide="badge-check" class="h-5 w-5 text-blue-500"></i>' : ''}
                    </div>

                    <div class="text-sm text-slate-500">${user.fullName}</div>
                  </div>

                  <button id="logoutButton" class="rounded-full bg-red-500 px-4 py-2 text-xs font-bold text-white">
                    Log out
                  </button>
                </div>

                <div class="mt-4 grid grid-cols-3 text-center">
                  <div>
                    <div class="font-black">${Number(user.followers).toLocaleString()}</div>
                    <div class="text-xs text-slate-500">Followers</div>
                  </div>
                  <div>
                    <div class="font-black">416</div>
                    <div class="text-xs text-slate-500">Following</div>
                  </div>
                  <div>
                    <div class="font-black">${state.posts.length}</div>
                    <div class="text-xs text-slate-500">Posts</div>
                  </div>
                </div>
              </div>
            </div>

            <p class="mt-5 rounded-2xl bg-slate-100 p-4 text-sm dark:bg-slate-800">
              Soft sunsets, coffee, and city lights ✨
            </p>
          </section>
        </main>
      `;
    }

    function renderApp() {
      const state = getState();
      const user = currentUser(state);

      document.body.classList.toggle('dark', state.darkMode);

      const tabs = [
        ['home', 'Home', 'house'],
        ['messages', 'Messages', 'message-circle'],
        ['create', 'Create', 'plus-square'],
        ['discover', 'Discover', 'search'],
        ['reels', 'Reels', 'play-square'],
        ['profile', 'Profile', 'user']
      ];

      let view = renderHome(state);

      if (state.activeTab === 'messages') view = renderMessages(state);
      if (state.activeTab === 'create') view = renderCreate();
      if (state.activeTab === 'discover') view = renderDiscover(state);
      if (state.activeTab === 'reels') view = renderReels(state);
      if (state.activeTab === 'profile') view = renderProfile(state);

      document.getElementById('app').innerHTML = `
        <div class="mx-auto max-w-screen-2xl px-3 pb-28 pt-3 sm:px-5">
          <header class="sticky top-0 z-20 pb-4">
            <div class="glass-strong rounded-[2rem] px-4 py-3">
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="flex h-11 w-11 items-center justify-center rounded-2xl gradient-main text-xl font-black text-white">
                    C
                  </div>
                  <div class="text-xl font-black text-gradient">Crush.X</div>
                </div>

                <nav class="desktop-nav flex items-center gap-2">
                  ${tabs.map(([id, label, icon]) => `
                    <button
                      data-tab="${id}"
                      class="tab-button flex items-center gap-2 rounded-full px-4 py-2 text-sm font-bold ${
                        state.activeTab === id
                          ? 'gradient-main text-white'
                          : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-200'
                      }"
                    >
                      <i data-lucide="${icon}" class="h-4 w-4"></i>
                      ${label}
                    </button>
                  `).join('')}
                </nav>

                <div class="flex items-center gap-2">
                  <button id="themeButton" class="rounded-full bg-slate-100 p-3 dark:bg-slate-800">
                    <i data-lucide="${state.darkMode ? 'sun' : 'moon'}" class="h-5 w-5"></i>
                  </button>

                  <button id="profileButton" class="h-11 w-11 overflow-hidden rounded-full ring-2 ring-pink-200">
                    <img src="${user.avatar}" class="h-full w-full object-cover" />
                  </button>
                </div>
              </div>
            </div>
          </header>

          ${view}
        </div>

        <nav class="bottom-nav glass-strong flex items-center justify-around rounded-[2rem] p-2 md:hidden">
          ${tabs.map(([id, label, icon]) => `
            <button
              data-tab="${id}"
              class="tab-button flex min-w-[58px] flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold ${
                state.activeTab === id
                  ? 'gradient-main text-white'
                  : 'text-slate-500 dark:text-slate-300'
              }"
            >
              <i data-lucide="${icon}" class="h-4 w-4"></i>
              ${label}
            </button>
          `).join('')}
        </nav>
      `;

      bindAppEvents();

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    function bindAppEvents() {
      document.querySelectorAll('[data-tab]').forEach(button => {
        button.addEventListener('click', () => {
          const state = getState();
          state.activeTab = button.dataset.tab;
          saveState(state);
          renderApp();
        });
      });

      document.getElementById('themeButton')?.addEventListener('click', () => {
        const state = getState();
        state.darkMode = !state.darkMode;
        saveState(state);
        renderApp();
      });

      document.getElementById('profileButton')?.addEventListener('click', () => {
        const state = getState();
        state.activeTab = 'profile';
        saveState(state);
        renderApp();
      });

      document.getElementById('logoutButton')?.addEventListener('click', logout);

      document.getElementById('searchInput')?.addEventListener('input', event => {
        const state = getState();
        state.searchQuery = event.target.value;
        saveState(state);
        renderApp();
      });

      document.querySelectorAll('[data-follow-user]').forEach(button => {
        button.addEventListener('click', () => {
          const state = getState();
          const user = state.users.find(item => item.id === button.dataset.followUser);

          if (!user) return;

          user.following = !user.following;
          user.followers = Math.max(
            0,
            Number(user.followers) + (user.following ? 1 : -1)
          );

          saveState(state);
          renderApp();
        });
      });

      document.querySelectorAll('[data-comment-send]').forEach(button => {
        button.addEventListener('click', () => {
          const postId = button.dataset.commentSend;
          const input = document.querySelector(`[data-comment-input="${postId}"]`);
          const text = input?.value.trim();

          if (!text) return;

          const state = getState();
          const post = state.posts.find(item => item.id === postId);
          const user = currentUser(state);

          if (!post) return;

          post.comments.push({
            user: user.username,
            text
          });

          saveState(state);
          renderApp();
        });
      });

      const mediaInput = document.getElementById('mediaInput');
      const preview = document.getElementById('mediaPreview');

      mediaInput?.addEventListener('change', () => {
        const file = mediaInput.files?.[0];

        if (!file || !preview) return;

        const objectUrl = URL.createObjectURL(file);

        preview.classList.remove('hidden');
        preview.innerHTML = file.type.startsWith('video/')
          ? `<video src="${objectUrl}" controls class="max-h-96 w-full object-cover"></video>`
          : `<img src="${objectUrl}" alt="Media preview" class="max-h-96 w-full object-cover" />`;
      });

      document.getElementById('uploadButton')?.addEventListener('click', () => {
        const file = mediaInput?.files?.[0];
        const caption = document.getElementById('captionInput')?.value.trim();

        if (!file) {
          alert('Select an image or video first.');
          return;
        }

        uploadToS3(file, caption);
      });
    }

    document.getElementById('authButton').addEventListener('click', handleAuthAction);
    document.getElementById('switchAuthButton').addEventListener('click', toggleAuthMode);
    document.getElementById('confirmButton').addEventListener('click', confirmAccount);
    document.getElementById('resendButton').addEventListener('click', resendCode);

    document.getElementById('forgotButton').addEventListener('click', () => {
      alert('Connect this button to the Cognito forgot-password flow.');
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
      restoreSession();
    });
  </script>
</body>
</html>
