<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crush.X</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./app-experience.css" />
  <link rel="stylesheet" href="./story-editor.css" />
  <link rel="stylesheet" href="./social-interactions.css" />
  <link rel="stylesheet" href="./social-advanced.css" />
  <link rel="stylesheet" href="./social-notifications.css" />
  <link rel="stylesheet" href="./heads-up-notifications.css" />

  <style>
    :root {
      --bg: #fff7fc;
      --card: rgba(255,255,255,.84);
      --strong: rgba(255,255,255,.97);
      --text: #171b2e;
      --muted: #64748b;
      --line: rgba(148,163,184,.18);
      --shadow: rgba(124,58,237,.12);
    }

    .dark {
      --bg: #090d18;
      --card: rgba(15,23,42,.88);
      --strong: rgba(17,24,39,.98);
      --text: #edf3ff;
      --muted: #9aa9c5;
      --line: rgba(148,163,184,.18);
      --shadow: rgba(2,6,23,.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255,79,163,.14), transparent 20%),
        radial-gradient(circle at top right, rgba(124,58,237,.15), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .glass {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 14px 32px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .glass-strong {
      background: var(--strong);
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .gradient-main {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed 52%, #38bdf8);
    }

    .text-gradient {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .story-ring {
      background: linear-gradient(135deg, #ff4fa3, #7c3aed, #38bdf8);
      padding: 2px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 30;
      width: min(94vw, 560px);
      transform: translateX(-50%);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(10px);
    }

    .loader.show {
      display: flex;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #authOverlay, #confirmationModal { overflow-y: auto; }
    #authOverlay > div, #confirmationModal > div { margin: auto; }
    input, textarea, .flex-1 { min-width: 0; }
    main { overflow-wrap: anywhere; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .bottom-nav { bottom: max(12px, env(safe-area-inset-bottom)); }
    .bottom-nav button { min-width: 0; flex: 1; padding-inline: 3px; }
    .reel-media { height: min(65dvh, 650px); }
    @media (max-width: 1279px) {
      header .desktop-nav {
        display: none;
      }
    }
      main { max-width:760px; margin-inline:auto; }
    main button { min-height:44px; }
    button:focus-visible,[role="button"]:focus-visible { outline:2px solid #db2777; outline-offset:3px; }
    button:disabled { opacity:.4; cursor:default; }
    .app-dialog { width:min(94vw,540px); max-height:90dvh; border:1px solid var(--line); border-radius:20px; padding:20px; background:var(--strong); color:var(--text); }
    .app-dialog::backdrop { background:rgba(0,0,0,.65); }
    .app-media-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; margin-top:20px; }
    .app-media-grid img,.app-media-grid video { width:100%; aspect-ratio:1; object-fit:cover; }
    .home-stories { overflow:hidden; }
    .story-track { display:flex; gap:15px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none; padding:7px 3px 5px; }
    .story-track::-webkit-scrollbar { display:none; }
    .story-tile { position:relative; display:flex; flex:0 0 79px; flex-direction:column; align-items:center; min-width:0; cursor:pointer; }
    .story-border { width:76px; height:76px; display:grid; place-items:center; padding:3px; border-radius:50%; background:linear-gradient(35deg,#fbbf24 9%,#f43f5e 36%,#c026d3 73%,#7c3aed); }
    .story-border.is-own { padding:0; background:none; }
    .story-border img { width:100%; height:100%; border:3px solid var(--strong); border-radius:50%; object-fit:cover; }
    .story-caption { max-width:91px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .story-add { position:absolute; right:0; top:52px; display:grid; place-items:center; width:27px; height:27px; border:2px solid var(--strong); border-radius:50%; background:#1d9bf0; color:white; }
    .feed-card { overflow:hidden; }
    .feed-author { display:flex; align-items:center; gap:10px; padding:12px 14px; }
    .feed-author-avatar { width:40px; height:40px; flex:none; border-radius:50%; object-fit:cover; }
    .feed-media { width:100%; position:relative; background:#141414; }
    .feed-media img,.feed-media video { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; }
    .feed-action { display:grid; place-items:center; width:44px; height:44px; border-radius:12px; }
    .feed-action[aria-pressed="true"] { color:#f43f5e; }
    .feed-save[aria-pressed="true"] { color:#7c3aed; }
    .feed-filter { display:flex; align-items:center; gap:24px; padding:0 12px; }
    .feed-filter button[aria-pressed="true"] { color:#ec4899; border-bottom:2px solid currentColor; }
    .feed-filter button { min-height:38px; font-size:13px; font-weight:750; }
    .mobile-header { display:none; }
    @media (max-width: 639px) {
      body { background:var(--bg); }
      #app > .app-shell { padding:0 0 calc(78px + env(safe-area-inset-bottom)) !important; }
      .app-header { position:sticky; top:0; z-index:20; padding:0 !important; }
      .app-header > .header-shell { border:0; border-bottom:1px solid var(--line); border-radius:0; padding:8px 12px; background:var(--strong); box-shadow:none; }
      .mobile-header { display:flex; width:100%; align-items:center; justify-content:space-between; }
      .mobile-header .brand { font-family:Georgia,serif; font-size:29px; font-weight:900; letter-spacing:-1.6px; }
      .mobile-header .header-icon { width:44px; height:44px; display:grid; place-items:center; }
      .desktop-header-content { display:none !important; }
      .sample-hint { margin:4px 12px 7px !important; padding:0 !important; background:none !important; color:var(--muted) !important; font-size:10px !important; }
      #appStatus { margin:0 12px; }
      .home-feed { gap:0 !important; max-width:none; }
      .home-stories { border:0; border-bottom:1px solid var(--line); border-radius:0; background:var(--strong); box-shadow:none; padding:11px 0 9px; }
      .story-track { padding-inline:13px; }
      .feed-filter { background:var(--strong); border-bottom:1px solid var(--line); }
      .feed-card { border:0; border-radius:0; background:var(--strong); box-shadow:none; margin-bottom:7px; }
      .feed-media img,.feed-media video { aspect-ratio:3/4; }
      .bottom-nav { left:0; bottom:0; width:100%; transform:none; padding:7px 4px calc(7px + env(safe-area-inset-bottom)); border:0; border-top:1px solid var(--line); border-radius:0; background:var(--strong); box-shadow:none; }
      .bottom-nav .tab-button { flex:1; min-height:48px; max-width:80px; border-radius:20px; }
      .bottom-nav .tab-button[aria-current="page"] { background:rgba(148,163,184,.13); }
      .bottom-nav .tab-button svg { width:25px; height:25px; }
      .bottom-nav .tab-caption { display:none; }
    }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>

<body>
  <!-- Login and signup -->
  <div id="authOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xl">
    <div class="glass-strong w-full max-w-md rounded-[2rem] p-6">
      <div class="text-center">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl gradient-main text-3xl font-black text-white">
          C
        </div>

        <h1 id="authTitle" class="mt-4 text-3xl font-black text-gradient">
          Welcome to Crush.X
        </h1>

        <p id="authDescription" class="mt-2 text-sm text-slate-500">
          Find your vibe. Match your mood.
        </p>
      </div>

      <form id="authForm" novalidate class="mt-6 space-y-3">
        <input
          aria-label="Username or email" id="usernameInput"
          type="text"
          autocomplete="username"
          placeholder="Username or email"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />

        <input
          aria-label="Email address" id="emailInput"
          type="email"
          autocomplete="email"
          placeholder="Email address"
          class="hidden w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />

        <input
          aria-label="Password" id="passwordInput"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          class="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3 text-sm outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
        />
        <input aria-label="Reset code" id="resetCodeInput" class="hidden w-full rounded-2xl border px-4 py-3" placeholder="Reset code" autocomplete="one-time-code" />
      </form>

      <button
        type="submit" form="authForm"
        id="authButton"
        class="mt-5 w-full rounded-2xl gradient-main px-4 py-3.5 text-sm font-bold text-white"
      >
        Login
      </button>

      <div class="mt-5 flex justify-between text-sm">
        <button id="switchAuthButton" class="font-bold text-pink-600">
          Create account
        </button>

        <button id="forgotButton" class="font-semibold text-slate-500">
          Forgot password?
        </button>
      </div>

      <div role="status" aria-live="polite" id="authMessage" class="mt-4 hidden rounded-2xl p-3 text-center text-xs font-bold"></div>
    </div>
  </div>

  <!-- Account confirmation -->
  <div id="confirmationModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/70 p-4 backdrop-blur-xl">
    <div class="glass-strong w-full max-w-md rounded-[2rem] p-6">
      <h2 class="text-2xl font-black">Verify your account</h2>
      <p class="mt-2 text-sm text-slate-500">
        Enter the verification code sent to your email.
      </p>

      <input
        aria-label="Verification code" id="confirmationCode"
        maxlength="6"
        inputmode="numeric"
        placeholder="Verification code"
        class="mt-5 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-center text-xl tracking-[.5em] outline-none dark:border-slate-700 dark:bg-slate-900"
      />

      <button
        id="confirmButton"
        class="mt-4 w-full rounded-2xl gradient-main px-4 py-3 font-bold text-white"
      >
        Verify account
      </button>

      <div id="confirmationMessage" role="status" class="mt-3 text-sm"></div>
      <button id="cancelConfirmation" class="mt-3 w-full text-sm">Back to login</button>
      <button
        id="resendButton"
        class="mt-4 w-full text-sm font-bold text-pink-600"
      >
        Resend code
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loader" class="loader">
    <div class="text-center text-white">
      <div class="spinner mx-auto"></div>
      <div id="loaderText" class="mt-4 text-sm font-bold">Please wait...</div>
    </div>
  </div>

  <div id="app" class="min-h-screen"></div>

  <script>
    /*
      Use the exact values from:
      AWS Console → Cognito → User pools
    */
    const COGNITO_CONFIG = {
      UserPoolId: 'us-west-2_PAT0udHTx',
      ClientId: '1fvstb7h8vqbk7qt98bd46aj0'
    };

    // Existing API setting retained for audit. No verified publishing contract is present.
    const API_BASE_URL =
      'https://jzym971249.execute-api.us-west-2.amazonaws.com/prod';

    const STATE_KEY = 'crushx_single_file_state';

    let cognitoPool = null;
    let pendingUser = null;
    let signUpMode = false;
    let recoveryMode = null;
    let recoveryUser = null;
    let previewUrl = null;

    const defaultUsers = [
      {
        id: 'me',
        username: 'mounnishant1',
        fullName: 'Mounnishant',
        info: 'Sushi · Seoul Nights · Sunflower',
        followers: 9472,
        following: false,
        verified: true,
        avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=500&q=80'
      },
      {
        id: 'user_1',
        username: 'aanya_arts',
        fullName: 'Aanya',
        info: 'Pasta · Kyoto · City of Stars',
        followers: 18340,
        following: true,
        verified: true,
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80'
      },
      {
        id: 'user_2',
        username: 'vibe.city',
        fullName: 'Noah',
        info: 'Burgers · New York · Midnight City',
        followers: 25100,
        following: false,
        verified: false,
        avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80'
      },
      {
        id: 'user_3',
        username: 'zoe.foodie',
        fullName: 'Zoe',
        info: 'Tacos · Mexico City · Taki Taki',
        followers: 6492,
        following: true,
        verified: false,
        avatar: 'https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=500&q=80'
      },
      {
        id: 'user_4',
        username: 'lina.travel',
        fullName: 'Lina',
        info: 'Pizza · Paris · Lovely Day',
        followers: 12987,
        following: false,
        verified: false,
        avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=500&q=80'
      }
    ];

    const defaultState = {
      darkMode: false,
      activeTab: 'home',
      currentUserId: 'me',
      searchQuery: '',
      users: defaultUsers,
      stories: [
        {
          id: 'story_1',
          userId: 'me',
          image: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80',
          expiresAt: Date.now() + 86400000
        },
        {
          id: 'story_2',
          userId: 'user_1',
          image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80',
          expiresAt: Date.now() + 86400000
        },
        {
          id: 'story_3',
          userId: 'user_2',
          image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80',
          expiresAt: Date.now() + 86400000
        }
      ],
      posts: [
        {
          id: 'post_1',
          userId: 'me',
          image: 'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80',
          location: 'Lake Como',
          caption: 'Golden hour with the best kind of chaos. ✨ @aanya_arts',
          likes: 1248,
          shares: 18,
          comments: [
            { user: 'aanya_arts', text: 'This is so dreamy 😍' }
          ]
        },
        {
          id: 'post_2',
          userId: 'user_1',
          image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=1200&q=80',
          location: 'Seoul',
          caption: 'Life in color and coffee. ☕️',
          likes: 2450,
          shares: 42,
          comments: [
            { user: 'mounnishant1', text: 'The palette is immaculate.' }
          ]
        }
      ],
      reels: [
        {
          id: 'reel_1',
          userId: 'me',
          source: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80',
          caption: 'Midnight city vibes ✨',
          likes: 2189,
          comments: 420,
          shares: 33,
          song: 'Midnight City',
          artist: 'M83'
        }
      ]
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);
    const localText = (value, limit = 2000) => typeof value === 'string' ? value.slice(0, limit) : '';
    const localId = value => typeof value === 'string' && /^[a-zA-Z0-9_.-]{1,128}$/.test(value) && !['__proto__', 'constructor', 'prototype'].includes(value);
    const localCount = value => Number.isFinite(Number(value)) ? Math.max(0, Math.min(1e12, Number(value))) : 0;

    // Browser state is untrusted sample data, never an authenticated identity.
    function normalizeState(value) {
      const raw = isRecord(value) ? value : {};
      const state = clone(defaultState);
      const records = (items, fallback) => Array.isArray(items) ? items.filter(isRecord).slice(0, 1000) : clone(fallback);
      const unique = items => items.filter((item, index) => localId(item.id) && items.findIndex(other => other.id === item.id) === index);
      state.users = unique(records(raw.users, defaultState.users).map(user => ({
        id: user.id, username: localText(user.username, 128), fullName: localText(user.fullName, 200),
        info: localText(user.info), avatar: localText(user.avatar), followers: localCount(user.followers),
        following: user.following === true, verified: user.verified === true
      })));
      if (!state.users.some(user => user.id === 'me')) state.users.unshift(clone(defaultUsers[0]));
      const userExists = id => state.users.some(user => user.id === id);
      const comments = value => records(value, []).map((comment, index) => ({
        user: localText(comment.user, 128), text: localText(comment.text),
        id: localId(comment.id) ? comment.id : 'c_' + index,
        parentId: localId(comment.parentId) ? comment.parentId : null,
        liked: comment.liked === true, likes: localCount(comment.likes),
        likedBy: [...new Set((Array.isArray(comment.likedBy) ? comment.likedBy : (comment.liked === true ? ['me'] : []))
          .filter(id => localId(id) && state.users.some(user => user.id === id)))].slice(0,100)
      }));
      state.posts = unique(records(raw.posts, defaultState.posts).filter(post => userExists(post.userId)).map(post => ({
        id: post.id, userId: post.userId, image: localText(post.image), source: localText(post.source),
        contentType: localText(post.contentType, 100), mediaType: localText(post.mediaType, 100), location: localText(post.location, 200),
        caption: localText(post.caption), likes: localCount(post.likes), shares: localCount(post.shares),
        liked: post.liked === true, saved: post.saved === true, comments: comments(post.comments)
      })));
      state.reels = unique(records(raw.reels, defaultState.reels).filter(reel => userExists(reel.userId)).map(reel => ({
        id: reel.id, userId: reel.userId, source: localText(reel.source), caption: localText(reel.caption),
        contentType: localText(reel.contentType, 100), mediaType: localText(reel.mediaType, 100),
        likes: localCount(reel.likes), shares: localCount(reel.shares), liked: reel.liked === true, saved: reel.saved === true,
        comments: comments(reel.comments), song: localText(reel.song, 200), artist: localText(reel.artist, 200)
      })));
      // Isolated sample-only social interactions. Never treat these as server receipts.
      const validItemIds = new Set([...state.posts, ...state.reels].map(item => item.id));
      state.socialCollections = unique(records(raw.socialCollections, []).map(collection => ({
        id: collection.id, name: localText(collection.name, 45),
        itemIds: Array.isArray(collection.itemIds) ? [...new Set(collection.itemIds.filter(id => localId(id) && validItemIds.has(id)))].slice(0,500) : []
      }))).filter(collection => collection.name.trim()).slice(0,30);
      state.socialHiddenIds = Array.isArray(raw.socialHiddenIds) ? [...new Set(raw.socialHiddenIds.filter(id => localId(id) && validItemIds.has(id)))].slice(0,500) : [];
      state.socialMutedIds = Array.isArray(raw.socialMutedIds) ? [...new Set(raw.socialMutedIds.filter(id => localId(id) && userExists(id) && id !== 'me'))].slice(0,500) : [];
      state.socialNotifications = unique(records(raw.socialNotifications, []).map(event => ({
        id: event.id, type: event.type === 'comment_like' ? 'comment_like' : '',
        actorId: localId(event.actorId) ? event.actorId : '',
        recipientId: localId(event.recipientId) ? event.recipientId : '',
        itemId: localId(event.itemId) ? event.itemId : '',
        commentId: localId(event.commentId) ? event.commentId : '',
        read: event.read === true,
        createdAt: Number.isFinite(Number(event.createdAt)) ? Math.max(0,Number(event.createdAt)) : 0
      }))).filter(event => event.type === 'comment_like' &&
        userExists(event.actorId) && userExists(event.recipientId) && event.actorId !== event.recipientId &&
        validItemIds.has(event.itemId) &&
        [...state.posts,...state.reels].some(item => item.id === event.itemId &&
          item.comments.some(comment => comment.id === event.commentId))).slice(-500);
      state.socialStoryDrafts = unique(records(raw.socialStoryDrafts, []).map(draft => ({
        id: draft.id, itemId: localId(draft.itemId) && validItemIds.has(draft.itemId) ? draft.itemId : '',
        note: localText(draft.note, 200)
      }))).filter(draft => draft.itemId).slice(0,30);
      state.stories = unique(records(raw.stories, defaultState.stories).filter(story => userExists(story.userId)).map(story => ({
        id: story.id, userId: story.userId, image: localText(story.image), expiresAt: Number.isFinite(Number(story.expiresAt)) ? Math.max(0, Number(story.expiresAt)) : 0
      })));
      state.darkMode = raw.darkMode === true;
      state.activeTab = ['home', 'messages', 'create', 'discover', 'reels', 'profile'].includes(raw.activeTab) ? raw.activeTab : 'home';
      state.searchQuery = localText(raw.searchQuery, 200);
      state.currentUserId = 'me'; // Fixed sample persona; never a Cognito subject.
      state.chatUserId = localId(raw.chatUserId) && raw.chatUserId !== 'me' && userExists(raw.chatUserId) ? raw.chatUserId : null;
      state.messageDrafts = {};
      if (isRecord(raw.messageDrafts)) {
        for (const user of state.users) {
          if (user.id !== 'me' && Object.hasOwn(raw.messageDrafts, user.id)) state.messageDrafts[user.id] = localText(raw.messageDrafts[user.id], 4000);
        }
      }
      return state;
    }

    let memoryState = clone(defaultState);
    let storageUnavailable = false;
    function getState() {
      if (storageUnavailable) return clone(memoryState);
      let saved;
      try { saved = localStorage.getItem(STATE_KEY); }
      catch { storageUnavailable = true; return clone(memoryState); }
      try {
        memoryState = normalizeState(saved ? JSON.parse(saved) : memoryState);
      } catch {
        memoryState = clone(defaultState);
        try { localStorage.removeItem(STATE_KEY); }
        catch { storageUnavailable = true; }
      }
      return clone(memoryState);
    }

    function saveState(state) {
      memoryState = normalizeState(state);
      try { localStorage.setItem(STATE_KEY, JSON.stringify(memoryState)); }
      catch { storageUnavailable = true; }
    }

    function currentUser(state) {
      return state.users.find(user => user.id === state.currentUserId) || state.users[0];
    }

    function userById(state, id) {
      return state.users.find(user => user.id === id);
    }

    function escapeHTML(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatText(value = '') {
      return escapeHTML(value).replace(
        /(@[a-zA-Z0-9_.]+)/g,
        '<span class="font-bold text-pink-500">$1</span>'
      );
    }

    function showLoader(message) {
      document.getElementById('loaderText').textContent = message;
      document.getElementById('loader').classList.add('show');
      document.querySelectorAll('#authOverlay button, #confirmationModal button').forEach(b => b.disabled = true);
    }

    function hideLoader() {
      document.getElementById('loader').classList.remove('show');
      document.querySelectorAll('#authOverlay button, #confirmationModal button').forEach(b => b.disabled = false);
    }

    function showAuthMessage(message, success = false) {
      const element = document.getElementById('authMessage');

      if (!message) {
        element.className = 'hidden';
        return;
      }

      element.textContent = message;
      element.className = success
        ? 'mt-4 rounded-2xl bg-emerald-100 p-3 text-center text-xs font-bold text-emerald-700'
        : 'mt-4 rounded-2xl bg-red-100 p-3 text-center text-xs font-bold text-red-700';
    }

    function getCognitoPool() {
      if (!window.AmazonCognitoIdentity) {
        throw new Error('Cognito SDK failed to load.');
      }

      if (!cognitoPool) {
        cognitoPool =
          new AmazonCognitoIdentity.CognitoUserPool(COGNITO_CONFIG);
      }

      return cognitoPool;
    }

    function toggleAuthMode() {
      authRevision++;
      if (recoveryMode) {
        recoveryMode = null;
        recoveryUser = null;
        signUpMode = true;
      }
      signUpMode = !signUpMode;
      document.getElementById('passwordInput').classList.remove('hidden');
      document.getElementById('resetCodeInput').classList.add('hidden');
      document.getElementById('resetCodeInput').value = '';
      document.getElementById('usernameInput').readOnly = false;
      document.getElementById('passwordInput').placeholder = 'Password';
      document.getElementById('passwordInput').autocomplete = signUpMode ? 'new-password' : 'current-password';

      document.getElementById('authTitle').textContent =
        signUpMode ? 'Create Account' : 'Welcome to Crush.X';

      document.getElementById('authDescription').textContent =
        signUpMode
          ? 'Join the Crush.X community.'
          : 'Find your vibe. Match your mood.';

      document.getElementById('authButton').textContent =
        signUpMode ? 'Register' : 'Login';

      document.getElementById('switchAuthButton').textContent =
        signUpMode ? 'Already have an account?' : 'Create account';

      document.getElementById('emailInput').classList.toggle(
        'hidden',
        !signUpMode
      );

      document.getElementById('forgotButton').classList.toggle(
        'hidden',
        signUpMode
      );

      document.getElementById('usernameInput').placeholder =
        signUpMode ? 'Choose a username' : 'Username or email';

      document.getElementById('usernameInput').value = '';
      document.getElementById('emailInput').value = '';
      document.getElementById('passwordInput').value = '';

      showAuthMessage('');
    }

    // Cognito-supported ASCII special characters; whitespace/non-ASCII symbols
    // alone do not satisfy this frontend requirement. Server policy is authoritative.
    const COGNITO_SPECIAL_CHARACTERS = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";
    const PASSWORD_REQUIREMENTS = 'Password needs at least 8 characters, uppercase, lowercase, a number and a supported special character (for example !, @ or #).';

    function validPassword(password) {
      return (
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /\d/.test(password) &&
        Array.from(COGNITO_SPECIAL_CHARACTERS).some(character => password.includes(character))
      );
    }

    function signUp() {
      const revision = authRevision;
      const username = document.getElementById('usernameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;

      if (!username || !email || !password) {
        showAuthMessage('Please complete all fields.');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAuthMessage('Enter a valid email address.');
        return;
      }
      if (/\s/.test(username)) {
        showAuthMessage('Username cannot contain spaces.');
        return;
      }
      if (!validPassword(password)) {
        showAuthMessage(PASSWORD_REQUIREMENTS);
        return;
      }

      showLoader('Creating your account...');

      try {
        const pool = getCognitoPool();

        const attributes = [
          new AmazonCognitoIdentity.CognitoUserAttribute({
            Name: 'email',
            Value: email
          })
        ];

        pool.signUp(
          username,
          password,
          attributes,
          null,
          (error, result) => {
            if (revision !== authRevision) return;
            hideLoader();

            if (error) {
              showAuthMessage(error.message || 'Sign-up failed.');
              return;
            }

            if (result?.userConfirmed) {
              toggleAuthMode();
              showAuthMessage('Account created. You can now log in.', true);
              return;
            }
            if (!result?.user) { showAuthMessage('Sign-up did not return a user. Please try again.'); return; }
            pendingUser = result.user;
            document.getElementById('confirmationCode').value = '';
            document.getElementById('confirmationMessage').textContent = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('confirmationModal').classList.remove('hidden');
            document.getElementById('confirmationModal').classList.add('flex');
          }
        );
      } catch (error) {
        hideLoader();
        showAuthMessage(error.message);
      }
    }

    let authenticatedUser = null;
    let sessionDeadline = 0;
    let sessionTimer = null;
    let authRevision = 0;

    function clearAuthTokens() {
      clearTimeout(sessionTimer);
      sessionTimer = null;
      sessionDeadline = 0;
      try {
        sessionStorage.removeItem('crushx_access_token');
        sessionStorage.removeItem('crushx_id_token');
      } catch { /* Authentication remains closed if storage is denied. */ }
    }

    function resetAuthFields() {
      pendingUser = null;
      recoveryUser = null;
      recoveryMode = null;
      signUpMode = true;
      toggleAuthMode();
      document.getElementById('confirmationCode').value = '';
      document.getElementById('confirmationMessage').textContent = '';
      document.getElementById('confirmationModal').classList.add('hidden');
      document.getElementById('confirmationModal').classList.remove('flex');
    }

    function closeSession(message = '') {
      authRevision++; // Ignore callbacks belonging to a previous session or login.
      const user = authenticatedUser;
      authenticatedUser = null;
      clearAuthTokens();
      try { user?.signOut(); } catch {}
      hideLoader();
      resetAuthFields();
      document.getElementById('authOverlay').style.display = 'flex';
      showAuthMessage(message);
    }

    // Normal login, SMS MFA and SDK restoration all store the same token pair.
    // SDK validity is a frontend gate; backend authorization must verify JWTs.
    function acceptSession(session, user, revision) {
      if (revision !== authRevision) return;
      try {
        if (!session?.isValid()) throw new Error('Session expired. Please log in again.');
        const access = session.getAccessToken(), id = session.getIdToken();
        const expiry = Math.min(access.getExpiration(), id.getExpiration()) * 1000;
        if (!Number.isFinite(expiry) || expiry <= Date.now()) throw new Error('Session expired. Please log in again.');
        clearAuthTokens();
        sessionStorage.setItem('crushx_access_token', access.getJwtToken());
        sessionStorage.setItem('crushx_id_token', id.getJwtToken());
        sessionStorage.removeItem('crushx_logged_out');
        authenticatedUser = user;
        sessionDeadline = expiry;
        sessionTimer = setTimeout(checkSessionExpiration, Math.min(expiry - Date.now(), 2147483647));
        hideLoader();
        document.getElementById('passwordInput').value = '';
        document.getElementById('authOverlay').style.display = 'none';
        renderApp();
      } catch (error) {
        try { user?.signOut(); } catch {}
        closeSession(error.message || 'Could not restore authentication.');
      }
    }

    function checkSessionExpiration() {
      if (!authenticatedUser) return;
      if (Date.now() >= sessionDeadline) {
        // No backend writes are enabled. Require login when the accepted session
        // expires; restoration on reload uses Cognito's normal refresh flow.
        closeSession('Session expired. Please log in again.');
        renderApp();
      } else {
        clearTimeout(sessionTimer);
        sessionTimer = setTimeout(checkSessionExpiration, Math.min(sessionDeadline - Date.now(), 2147483647));
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkSessionExpiration();
    });

    function signIn() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!username || !password) return showAuthMessage('Please enter your username/email and password.');
      const revision = ++authRevision;
      clearAuthTokens();
      showLoader('Signing you in...');
      try {
        const pool = getCognitoPool();
        const details = new AmazonCognitoIdentity.AuthenticationDetails({ Username: username, Password: password });
        const user = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: pool });
        const fail = error => {
          if (revision !== authRevision) return;
          clearAuthTokens();
          hideLoader();
          if (error.code === 'UserNotConfirmedException') {
            pendingUser = user;
            document.getElementById('confirmationCode').value = '';
            document.getElementById('confirmationMessage').textContent = '';
            document.getElementById('confirmationModal').classList.remove('hidden');
            document.getElementById('confirmationModal').classList.add('flex');
          }
          showAuthMessage(error.code === 'NotAuthorizedException' || error.code === 'UserNotFoundException'
            ? 'Incorrect username or password.' : error.message || 'Login failed.');
        };
        user.authenticateUser(details, {
          onSuccess: session => acceptSession(session, user, revision),
          onFailure: fail,
          newPasswordRequired: () => fail({ message: 'This account requires a new password. Contact support to complete the required challenge.' }),
          customChallenge: () => fail({ message: 'This account requires an unsupported authentication challenge. Contact support.' }),
          selectMFAType: () => fail({ message: 'MFA selection is not configured in this frontend. Contact support.' }),
          mfaSetup: () => fail({ message: 'MFA setup is not configured in this frontend. Contact support.' }),
          totpRequired: () => fail({ message: 'Authenticator MFA is not configured in this frontend. Contact support.' }),
          mfaRequired() {
            if (revision !== authRevision) return;
            hideLoader();
            const code = prompt('Enter your six-digit SMS MFA code:');
            if (code === null) return fail({ message: 'MFA cancelled. Please log in again.' });
            if (!/^\d{6}$/.test(code.trim())) return fail({ message: 'Enter the six-digit MFA code. Please log in again.' });
            showLoader('Verifying MFA...');
            try {
              user.sendMFACode(code.trim(), {
                onSuccess: session => acceptSession(session, user, revision),
                onFailure: fail
              }, 'SMS_MFA');
            } catch (error) { fail(error); }
          }
        });
      } catch (error) {
        if (revision === authRevision) { clearAuthTokens(); hideLoader(); showAuthMessage(error.message || 'Login failed.'); }
      }
    }

    function handleAuthAction() {
      if (document.getElementById('loader').classList.contains('show')) return;
      authRevision++; // Invalidate any outstanding restoration before another auth action.
      showAuthMessage('');
      if (recoveryMode === 'forgot') return requestReset();
      if (recoveryMode === 'reset') return resetPassword();
      signUpMode ? signUp() : signIn();
    }

    function confirmAccount() {
      const code = document.getElementById('confirmationCode').value.trim();
      const message = document.getElementById('confirmationMessage');
      if (!pendingUser || !/^\d{6}$/.test(code)) {
        message.textContent = 'Enter the six-digit verification code.';
        return;
      }
      const revision = authRevision;
      showLoader('Confirming account...');
      try {
        // Never silently transfer an email alias from another account.
        pendingUser.confirmRegistration(code, false, error => {
          if (revision !== authRevision) return;
          hideLoader();
          if (error) { message.textContent = error.message || 'Verification failed.'; return; }
          resetAuthFields();
          showAuthMessage('Account verified. You can now log in.', true);
        });
      } catch (error) { hideLoader(); message.textContent = error.message || 'Verification failed.'; }
    }

    function resendCode() {
      if (!pendingUser) return;
      const revision = authRevision;
      const message = document.getElementById('confirmationMessage');
      showLoader('Resending verification code...');
      try {
        pendingUser.resendConfirmationCode(error => {
          if (revision !== authRevision) return;
          hideLoader();
          message.textContent = error ? error.message || 'Could not resend code.' : 'A new verification code was sent.';
        });
      } catch (error) { hideLoader(); message.textContent = error.message || 'Could not resend code.'; }
    }

    function restoreSession() {
      const revision = ++authRevision;
      clearAuthTokens();
      try {
        // A late SDK refresh can recache credentials after signOut. Explicit
        // logout still prevents automatic restoration in this tab on reload.
        if (sessionStorage.getItem('crushx_logged_out') === '1') { closeSession(); return; }
        const user = getCognitoPool().getCurrentUser();
        if (!user) { closeSession(); return; }
        user.getSession((error, session) => {
          if (revision !== authRevision) return;
          if (error || !session?.isValid()) {
            try { user.signOut(); } catch {}
            closeSession('Session expired. Please log in again.');
            return;
          }
          acceptSession(session, user, revision);
        });
      } catch {
        closeSession('Could not restore authentication. Please log in again.');
      }
    }

    function logout() {
      try { sessionStorage.setItem('crushx_logged_out', '1'); } catch {}
      const user = authenticatedUser;
      closeSession();
      try { if (!user) getCognitoPool().getCurrentUser()?.signOut(); } catch {}
      const state = getState();
      state.messageDrafts = {};
      state.chatUserId = null;
      saveState(state);
      navigate('home');
    }

    // No verified publishing contract or approved upload destination is present.
    // Keep this guard even when invoked outside the Create screen.
    async function uploadToS3(file) {
      try { validateMedia(file); }
      catch (error) { alert(error.message); return; }
      alert('Publishing unavailable: the upload destination and backend contract have not been verified. No file was uploaded.');
    }

    function validateMedia(file) {
      if (!file || !['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'video/mp4', 'video/webm'].includes(file.type)) {
        throw new Error('Choose a JPEG, PNG, WebP, GIF, MP4 or WebM file.');
      }
      if (!Number.isFinite(file.size) || file.size <= 0 || file.size > 100 * 1024 * 1024) throw new Error('File must be between 1 byte and 100 MB.');
    }

    function validateUploadResponse(data) {
      if (!data || typeof data.uploadUrl !== 'string' || typeof data.mediaUrl !== 'string') throw new Error('Upload response requires uploadUrl and mediaUrl.');
      for (const value of [data.uploadUrl, data.mediaUrl]) {
        const url = new URL(value);
        if (url.protocol !== 'https:' || url.username || url.password) throw new Error('Upload and media URLs must use HTTPS without embedded credentials.');
      }
      // Shape validation does not authorize a destination; publishing remains blocked.
      return data;
    }

                        <button
                          data-follow-user="${escapeHTML(user.id)}"
                          class="${user.following ? 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200' : 'gradient-main text-white'} rounded-full px-3 py-2 text-xs font-bold"
                        >
                          ${user.following ? 'Following' : 'Follow'}
                        </button>
                      `
                  }
                </article>
              `).join('') : `
                <div class="rounded-2xl bg-slate-100 p-8 text-center dark:bg-slate-800">
                  <div class="text-4xl">🔍</div>
                  <div class="mt-3 font-bold">No users found</div>
                  <div class="mt-1 text-sm text-slate-500">Try another search.</div>
                </div>
              `}
            </div>
          </section>
        </main>
      `;
    }

    function renderCreate() {
      return `
        <main>
          <section class="glass rounded-[2rem] p-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xs font-bold uppercase tracking-[.2em] text-pink-500">
                  Create
                </div>
                <h1 class="mt-1 text-2xl font-black">New draft</h1>
              </div>

              <label class="cursor-pointer rounded-2xl gradient-main px-4 py-3 text-xs font-bold text-white">
                Select file
                <input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" class="hidden" />
              </label>
            </div>

            <div id="mediaPreview" class="mt-5 hidden overflow-hidden rounded-[2rem]"></div>

            <textarea
              id="captionInput"
              rows="4"
              placeholder="Write a caption..."
              class="mt-5 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none dark:border-slate-700 dark:bg-slate-800"
            ></textarea>

            <button
              id="uploadButton"
              class="mt-4 w-full rounded-2xl gradient-main px-4 py-3 text-sm font-bold text-white"
            >
              Check publishing availability
            </button>

            <p class="mt-3 text-center text-xs text-slate-500">
              Preview only · Publishing is not connected. Images and videos up to 100 MB.
            </p>
          </section>
        </main>
      `;
    }

    function safeMediaUrl(value) {
      try { const url = new URL(value); return url.protocol === 'https:' && !url.username && !url.password ? escapeHTML(url.href) : ''; }
      catch { return ''; }
    }

    function renderReels(state) {
      if (!state.reels.length) return '<main class="glass rounded-[2rem] p-5">No reels yet.</main>';
      return `<main class="space-y-5">${state.reels.map(reel => {
        const creator = userById(state, reel.userId) || currentUser(state);
        const source = safeMediaUrl(reel.source);
        const video = reel.mediaType === 'video' || reel.contentType?.startsWith('video/') || /\.(mp4|webm|mov)(?:[?#]|$)/i.test(reel.source);
        const comments = Array.isArray(reel.comments) ? reel.comments : [];
        return `<article class="glass mx-auto max-w-md overflow-hidden rounded-[2rem]">
          ${video ? `<video src="${source}" controls playsinline preload="metadata" class="reel-media w-full bg-black object-contain" aria-label="Reel video"></video>` : `<img src="${source}" alt="Reel image" class="reel-media w-full object-cover" />`}
          <div class="p-4">
            <div class="flex items-center gap-3"><img src="${safeMediaUrl(creator.avatar)}" alt="" class="h-11 w-11 rounded-full" /><strong>@${escapeHTML(creator.username)}</strong>
              ${creator.id !== state.currentUserId ? `<button data-follow-user="${escapeHTML(creator.id)}" class="ml-auto rounded-full bg-pink-500 px-3 py-2 text-white">${creator.following ? 'Following' : 'Follow'}</button>` : ''}</div>
            <p class="mt-3">${formatText(reel.caption)}</p>
            <p class="text-xs text-slate-500">${escapeHTML(reel.song)} · ${escapeHTML(reel.artist)}</p>
            <div class="mt-3 flex flex-wrap gap-4">
              <button data-like="${escapeHTML(reel.id)}" aria-pressed="${!!reel.liked}">${reel.liked ? 'Unlike' : 'Like'} · ${Number(reel.likes).toLocaleString()}</button>
              <button data-comment-focus="${escapeHTML(reel.id)}">Comments · ${comments.length}</button>
              <button data-share="${escapeHTML(reel.id)}">Share</button>
            </div>
            <div class="mt-3 space-y-2">${comments.map(c => `<p><strong>@${escapeHTML(c.user)}</strong> ${escapeHTML(c.text)}</p>`).join('')}</div>
            <div class="mt-3 flex gap-2"><input data-comment-input="${escapeHTML(reel.id)}" maxlength="2000" placeholder="Add a local comment..." class="flex-1 rounded-full border px-3 py-2 dark:bg-slate-800" /><button data-comment-send="${escapeHTML(reel.id)}" class="rounded-full gradient-main px-4 text-white">Send</button></div>
          </div>
        </article>`;
      }).join('')}</main>`;
    }

    function renderMessages(state) {
      const user = userById(state, state.chatUserId);
      if (user) return `<main class="glass rounded-[2rem] p-5">
        <button id="messagesBack" class="font-bold text-pink-500">← Back to Messages</button>
        <h1 class="mt-4 text-2xl font-black">@${escapeHTML(user.username)}</h1>
        <p class="mt-4">Messaging is unavailable. No chat API or delivery contract is configured.</p>
        <label class="mt-4 block" for="messageDraft">Local draft — kept only in this browser</label>
        <textarea id="messageDraft" maxlength="4000" class="mt-2 w-full rounded-2xl border p-3 dark:bg-slate-800" placeholder="Write a draft...">${escapeHTML(state.messageDrafts?.[user.id] || '')}</textarea>
        <p class="text-sm text-slate-500">Drafts are never sent or delivered.</p>
      </main>`;
      return `<main><section class="glass rounded-[2rem] p-4"><h1 class="text-2xl font-black">Messages</h1><p class="mt-2 text-sm text-slate-500">Local drafts only. Message delivery is unavailable.</p>
        <div class="mt-5 space-y-3">${state.users.filter(u => u.id !== state.currentUserId).map(u => `<button data-chat-user="${escapeHTML(u.id)}" class="flex w-full items-center gap-3 rounded-2xl bg-slate-100 p-3 text-left dark:bg-slate-800"><img src="${safeMediaUrl(u.avatar)}" alt="" class="h-12 w-12 rounded-full" /><span>@${escapeHTML(u.username)}<span class="block text-xs text-slate-500">Open local draft</span></span></button>`).join('')}</div>
      </section></main>`;
    }

    function renderProfile(state) {
      const user = currentUser(state);

      return `
        <main>
          <section class="glass rounded-[2rem] p-5">
            <h1 class="mb-4 text-xl font-black">Sample profile — not your Cognito account</h1>
            <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
              <img src="${safeMediaUrl(user.avatar)}" class="h-24 w-24 rounded-full object-cover ring-4 ring-pink-200" />

              <div class="flex-1">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-1 text-2xl font-black">
                      @${escapeHTML(user.username)}
                      ${user.verified ? '<i data-lucide="badge-check" class="h-5 w-5 text-blue-500"></i>' : ''}
                    </div>

                    <div class="text-sm text-slate-500">${escapeHTML(user.fullName)}</div>
                  </div>

                  <button id="logoutButton" class="rounded-full bg-red-500 px-4 py-2 text-xs font-bold text-white">
                    Log out
                  </button>
                </div>

                <div class="mt-4 grid grid-cols-3 text-center">
                  <div>
                    <div class="font-black">${Number(user.followers).toLocaleString()}</div>
                    <div class="text-xs text-slate-500">Followers</div>
                  </div>
                  <div>
                    <div class="font-black">416</div>
                    <div class="text-xs text-slate-500">Following</div>
                  </div>
                  <div>
                    <div class="font-black">${state.posts.length}</div>
                    <div class="text-xs text-slate-500">Posts</div>
                  </div>
                </div>
              </div>
            </div>

            <p class="mt-5 rounded-2xl bg-slate-100 p-4 text-sm dark:bg-slate-800">
              Soft sunsets, coffee, and city lights ✨
            </p>
            <button id="privacyPermissionsButton" type="button" class="mt-4 flex w-full items-center justify-between rounded-2xl border border-slate-200 p-4 text-left font-semibold dark:border-slate-700" aria-label="Open privacy and permissions">
              <span class="flex items-center gap-3"><i data-lucide="shield-check" class="h-5 w-5"></i> Privacy &amp; Permissions</span><i data-lucide="chevron-right" class="h-5 w-5"></i>
            </button>
          </section>
        </main>
      `;
    }

    function renderApp() {
      const state = getState();
      const user = currentUser(state);
      const focused = document.activeElement;
      const focusId = focused?.id;
      const selection = focused?.selectionStart;
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }

      document.body.classList.toggle('dark', state.darkMode);

      const tabs = [
        ['home', 'Home', 'house'],
        ['messages', 'Messages', 'message-circle'],
        ['create', 'Create', 'plus-square'],
        ['discover', 'Discover', 'search'],
        ['reels', 'Reels', 'play-square'],
        ['profile', 'Profile', 'user']
      ];
      const mobileTabs = [
        ['home', 'Home', 'house'],
        ['reels', 'Reels', 'play-square'],
        ['messages', 'Messages', 'send'],
        ['discover', 'Search', 'search'],
        ['profile', 'Profile', 'user-round']
      ];

      let view = renderHome(state);

      if (state.activeTab === 'messages') view = renderMessages(state);
      if (state.activeTab === 'create') view = renderCreate();
      if (state.activeTab === 'discover') view = renderDiscover(state);
      if (state.activeTab === 'reels') view = renderReels(state);
      if (state.activeTab === 'profile') view = renderProfile(state);

      document.getElementById('app').innerHTML = `
        <div class="app-shell mx-auto max-w-screen-2xl px-3 pb-28 pt-3 sm:px-5">
          <header class="app-header sticky top-0 z-20 pb-4">
            <div class="header-shell glass-strong rounded-[2rem] px-4 py-3">
              <div class="mobile-header">
                <button class="header-icon" data-tab="create" aria-label="Create a post or story"><i data-lucide="plus" class="h-8 w-8"></i></button>
                <span class="brand" aria-label="Crush.X">Crush.X</span>
                <button class="header-icon" id="activityButton" aria-label="Activity and notifications"><i data-lucide="heart" class="h-8 w-8"></i></button>
              </div>
              <div class="desktop-header-content flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="flex h-11 w-11 items-center justify-center rounded-2xl gradient-main text-xl font-black text-white">
                    C
                  </div>
                  <div class="text-xl font-black text-gradient">Crush.X</div>
                </div>

                <nav class="desktop-nav flex items-center gap-2">
                  ${tabs.map(([id, label, icon]) => `
                    <button
                      data-tab="${id}"
                      class="tab-button flex items-center gap-2 rounded-full px-4 py-2 text-sm font-bold ${
                        state.activeTab === id
                          ? 'gradient-main text-white'
                          : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-200'
                      }"
                    >
                      <i data-lucide="${icon}" class="h-4 w-4"></i>
                      ${label}
                    </button>
                  `).join('')}
                </nav>

                <div class="flex items-center gap-2">
                  <button aria-label="Toggle theme" id="themeButton" class="rounded-full bg-slate-100 p-3 dark:bg-slate-800">
                    <i data-lucide="${state.darkMode ? 'sun' : 'moon'}" class="h-5 w-5"></i>
                  </button>

                  <button aria-label="Open sample profile" id="profileButton" class="h-11 w-11 overflow-hidden rounded-full ring-2 ring-pink-200">
                    <img src="${safeMediaUrl(user.avatar)}" class="h-full w-full object-cover" />
                  </button>
                </div>
              </div>
            </div>
          </header>

          <p class="sample-hint mb-4 rounded-2xl bg-pink-50 p-3 text-xs text-pink-700">Sample preview · Local actions only. <button id="sampleModeInfo" class="font-bold underline">What works?</button></p>
          <p id="appStatus" role="status" aria-live="polite" class="mb-3 text-sm"></p>
          ${view}
        </div>

        <nav class="bottom-nav glass-strong flex items-center justify-around rounded-[2rem] p-2 xl:hidden" aria-label="Primary navigation">
          ${mobileTabs.map(([id, label, icon]) => `
            <button
              data-tab="${id}"
              aria-label="${label}" aria-current="${state.activeTab === id ? 'page' : 'false'}"
              class="tab-button flex min-w-[48px] flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold ${
                state.activeTab === id
                  ? 'text-slate-900 dark:text-white'
                  : 'text-slate-500 dark:text-slate-300'
              }"
            >
              ${id === 'profile' ? `<img src="${safeMediaUrl(user.avatar)}" alt="" class="h-7 w-7 rounded-full object-cover ${state.activeTab === id ? 'ring-2 ring-pink-500 ring-offset-1' : ''}" />` : `<i data-lucide="${icon}" class="h-5 w-5"></i>`}
              <span class="tab-caption">${label}</span>
            </button>
          `).join('')}
        </nav>
      `;

      bindAppEvents();
      if (focusId === 'searchInput') { const input = document.getElementById(focusId); input?.focus(); if (input) input.setSelectionRange(selection, selection); }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    function bindAppEvents() {
      bindRepairEvents();
      document.querySelectorAll('[data-tab]').forEach(button => {
        button.addEventListener('click', () => {
          navigate(button.dataset.tab);
        });
      });

      document.getElementById('themeButton')?.addEventListener('click', () => {
        const state = getState();
        state.darkMode = !state.darkMode;
        saveState(state);
        renderApp();
      });

      document.getElementById('profileButton')?.addEventListener('click', () => {
        navigate('profile');
      });

      document.getElementById('logoutButton')?.addEventListener('click', logout);

      document.getElementById('searchInput')?.addEventListener('input', event => {
        const state = getState();
        state.searchQuery = event.target.value;
        saveState(state);
        renderApp();
      });

      document.querySelectorAll('[data-follow-user]').forEach(button => {
        button.addEventListener('click', () => {
          const state = getState();
          const user = state.users.find(item => item.id === button.dataset.followUser);

          if (!user) return;

          user.following = !user.following;
          user.followers = Math.max(
            0,
            Number(user.followers) + (user.following ? 1 : -1)
          );

          saveState(state);
          renderApp();
        });
      });

      document.querySelectorAll('[data-comment-send]').forEach(button => {
        button.addEventListener('click', () => {
          const postId = button.dataset.commentSend;
          const input = [...document.querySelectorAll('[data-comment-input]')].find(element => element.dataset.commentInput === postId);
          const text = input?.value.trim();

          if (!text) return;

          const state = getState();
          const post = [...state.posts, ...state.reels].find(item => item.id === postId);
          const user = currentUser(state);

          if (!post) return;

          if (!Array.isArray(post.comments)) post.comments = [];
          post.comments.push({
            user: user.username,
            text: text.slice(0, 2000)
          });

          saveState(state);
          renderApp();
        });
      });

      const mediaInput = document.getElementById('mediaInput');
      const preview = document.getElementById('mediaPreview');

      mediaInput?.addEventListener('change', () => {
        const file = mediaInput.files?.[0];

        if (!preview) return;
        if (!file) { if (previewUrl) URL.revokeObjectURL(previewUrl); previewUrl = null; preview.innerHTML = ''; preview.classList.add('hidden'); return; }

        try { validateMedia(file); } catch (error) { mediaInput.value = ''; preview.classList.add('hidden'); preview.innerHTML = ''; if (previewUrl) URL.revokeObjectURL(previewUrl); previewUrl = null; alert(error.message); return; }
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        const objectUrl = previewUrl = URL.createObjectURL(file);

        preview.classList.remove('hidden');
        preview.innerHTML = file.type.startsWith('video/')
          ? `<video src="${objectUrl}" controls class="max-h-96 w-full object-cover"></video>`
          : `<img src="${objectUrl}" alt="Media preview" class="max-h-96 w-full object-cover" />`;
      });

      document.getElementById('uploadButton')?.addEventListener('click', () => {
        const file = mediaInput?.files?.[0];
        const caption = document.getElementById('captionInput')?.value.trim();

        if (!file) {
          alert('Select an image or video first.');
          return;
        }

        uploadToS3(file, caption);
      });
    }

    function beginRecovery() {
      authRevision++;
      recoveryMode = 'forgot';
      signUpMode = false;
      showAuthMessage('');
      document.getElementById('authTitle').textContent = 'Reset your password';
      document.getElementById('authDescription').textContent = 'Enter your username or email to request a reset code.';
      document.getElementById('authButton').textContent = 'Send reset code';
      document.getElementById('switchAuthButton').textContent = 'Back to login';
      document.getElementById('forgotButton').classList.add('hidden');
      document.getElementById('emailInput').classList.add('hidden');
      document.getElementById('passwordInput').classList.add('hidden');
      document.getElementById('passwordInput').value = '';
    }

    function requestReset() {
      const revision = authRevision;
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) return showAuthMessage('Enter your username or email.');
      try {
        const pool = getCognitoPool();
        recoveryUser = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: pool });
        showLoader('Requesting reset code...');
        const ready = () => {
          if (revision !== authRevision) return;
          hideLoader();
          recoveryMode = 'reset';
          document.getElementById('usernameInput').readOnly = true;
          document.getElementById('authButton').textContent = 'Reset password';
          document.getElementById('authDescription').textContent = 'Enter the code and a new password. ' + PASSWORD_REQUIREMENTS + ' Cognito enforces the pool policy.';
          document.getElementById('resetCodeInput').classList.remove('hidden');
          document.getElementById('passwordInput').classList.remove('hidden');
          document.getElementById('passwordInput').autocomplete = 'new-password';
          document.getElementById('passwordInput').placeholder = 'New password';
          showAuthMessage('If the account can be recovered, a reset code has been sent.', true);
          document.getElementById('resetCodeInput').focus();
        };
        recoveryUser.forgotPassword({ onSuccess: ready, inputVerificationCode: ready, onFailure(error) { if (revision !== authRevision) return; if (error.code === 'UserNotFoundException') { ready(); return; } hideLoader(); showAuthMessage(error.message || 'Could not request a reset code.'); } });
      } catch (error) { hideLoader(); showAuthMessage(error.message); }
    }

    function resetPassword() {
      const revision = authRevision;
      const code = document.getElementById('resetCodeInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!recoveryUser || !/^\d{6}$/.test(code)) return showAuthMessage('Enter the six-digit reset code.');
      if (!validPassword(password)) return showAuthMessage(PASSWORD_REQUIREMENTS);
      showLoader('Resetting password...');
      try {
        recoveryUser.confirmPassword(code, password, {
          onSuccess() { if (revision !== authRevision) return; hideLoader(); try { getCognitoPool().getCurrentUser()?.signOut(); } catch {} clearAuthTokens(); toggleAuthMode(); document.getElementById('passwordInput').placeholder = 'Password'; showAuthMessage('Password reset. Log in with your new password.', true); },
          onFailure(error) { if (revision !== authRevision) return; hideLoader(); showAuthMessage(error.message || 'Password reset failed.'); }
        });
      } catch (error) { hideLoader(); showAuthMessage(error.message); }
    }

    const validTabs = ['home', 'messages', 'create', 'discover', 'reels', 'profile'];
    function navigate(tab, chatUserId = null, push = true) {
      if (!validTabs.includes(tab)) tab = 'home';
      const state = getState();
      state.activeTab = tab;
      state.chatUserId = tab === 'messages' && chatUserId !== 'me' && userById(state, chatUserId) ? chatUserId : null;
      saveState(state);
      const hash = `#${tab}${state.chatUserId ? '/' + encodeURIComponent(state.chatUserId) : ''}`;
      if (push && location.hash !== hash) history.pushState(null, '', hash);
      renderApp();
      window.scrollTo(0, 0);
    }
    function routeFromLocation() {
      const [tab, user] = location.hash.slice(1).split('/');
      let chat = null;
      try { chat = user ? decodeURIComponent(user) : null; } catch {}
      navigate(tab || 'home', chat, false);
    }
    window.addEventListener('popstate', routeFromLocation);
    window.addEventListener('hashchange', routeFromLocation);

    function bindRepairEvents() {
      const status = text => { const element = document.getElementById('appStatus'); if (element) element.textContent = text; };
      document.querySelectorAll('[data-like], [data-save]').forEach(button => button.addEventListener('click', () => {
        const state = getState();
        const item = [...state.posts, ...state.reels].find(p => p.id === (button.dataset.like || button.dataset.save));
        if (!item) return;
        if (button.dataset.like) { item.liked = !item.liked; item.likes = Math.max(0, Number(item.likes || 0) + (item.liked ? 1 : -1)); }
        else item.saved = !item.saved;
        saveState(state); renderApp(); status('Saved in this browser only.');
      }));
      document.querySelectorAll('[data-comment-focus]').forEach(button => button.addEventListener('click', () => {
        const input = [...document.querySelectorAll('[data-comment-input]')].find(e => e.dataset.commentInput === button.dataset.commentFocus);
        input?.focus(); input?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }));
      document.querySelectorAll('[data-comment-input]').forEach(input => input.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); [...document.querySelectorAll('[data-comment-send]')].find(b => b.dataset.commentSend === input.dataset.commentInput)?.click(); }
      }));
      document.querySelectorAll('[data-share]').forEach(button => button.addEventListener('click', async () => {
        const state = getState();
        const item = [...state.posts, ...state.reels].find(p => p.id === button.dataset.share);
        if (!item) return;
        // Share the actual media URL; sample items have no public post permalink.
        const url = safeMediaUrl(item.source || item.image) ? new URL(item.source || item.image).href : '';
        if (!url) return status('No shareable media URL.');
        try {
          if (navigator.share) { await navigator.share({ title: 'Crush.X', text: item.caption, url }); status('Share completed.'); }
          else if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(url); status('Media link copied.'); }
          else window.prompt('Copy this media link:', url);
        } catch (error) { if (error.name !== 'AbortError') status('Sharing failed. Please try again.'); }
      }));
      document.querySelectorAll('[data-chat-user]').forEach(button => button.addEventListener('click', () => navigate('messages', button.dataset.chatUser)));
      document.getElementById('messagesBack')?.addEventListener('click', () => navigate('messages'));
      document.getElementById('messageDraft')?.addEventListener('input', event => {
        const state = getState(); state.messageDrafts ||= {}; state.messageDrafts[state.chatUserId] = event.target.value.slice(0, 4000); saveState(state);
      });
    }

    document.getElementById('cancelConfirmation').addEventListener('click', () => { document.getElementById('confirmationModal').classList.add('hidden'); document.getElementById('confirmationModal').classList.remove('flex'); pendingUser = null; signUpMode = true; toggleAuthMode(); });
    document.getElementById('authForm').addEventListener('submit', event => { event.preventDefault(); handleAuthAction(); });
    document.getElementById('switchAuthButton').addEventListener('click', toggleAuthMode);
    document.getElementById('confirmButton').addEventListener('click', confirmAccount);
    document.getElementById('resendButton').addEventListener('click', resendCode);

    document.getElementById('forgotButton').addEventListener('click', beginRecovery);

    document.addEventListener('DOMContentLoaded', () => {
      routeFromLocation();
      restoreSession();
    });
  </script>
  <script src="./app-improvements.js"></script>
  <script src="./social-interactions.js"></script>
  <script src="./social-advanced.js"></script>
  <script src="./social-notifications.js"></script>
  <script src="./heads-up-notifications.js"></script>
  <script src="./story-editor.js"></script>
  <script src="./permissions-center.js"></script>
  <script src="./aura-x-core.js"></script>
  <script src="./aura-x-assistant.js"></script>
</body>
