name: Crush.X lens source policy QA
on:
  pull_request:
    paths:
      - "UnityProjects/CrushXLensEngine/**"
      - ".github/workflows/crushx-lens-source-qa.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source policy (not runtime release proof)
        shell: bash
        working-directory: UnityProjects/CrushXLensEngine
        run: |
          python3 -B OpenLens/check_free_stack.py
          python3 -B OpenLens/test_lens_static.py -v
      - name: Verify model license is not silently bypassed
        shell: bash
        working-directory: UnityProjects/CrushXLensEngine
        run: |
          if python3 -B OpenLens/check_free_stack.py --release; then
            echo "ERROR: release gates unexpectedly marked as verified"
            exit 1
          fi
          echo "Release gate correctly fails closed while hardware/model tests remain pending"
