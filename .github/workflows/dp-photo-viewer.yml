name: Crush.X DP photo viewer checks
on:
  push:
    branches:
      - feature/dp-fullscreen-pinch-zoom-20261107
    paths:
      - index.html
      - app-improvements.js
      - social-advanced.js
      - social-interactions.js
      - dp-photo-viewer.js
      - dp-photo-viewer.css
      - tests/dp-photo-viewer*
      - .github/workflows/dp-photo-viewer.yml
  pull_request:
    paths:
      - index.html
      - app-improvements.js
      - social-advanced.js
      - social-interactions.js
      - dp-photo-viewer.js
      - dp-photo-viewer.css
      - tests/dp-photo-viewer*
      - .github/workflows/dp-photo-viewer.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source policy and JavaScript syntax
        run: |
          node --check dp-photo-viewer.js
          node --check tests/dp-photo-viewer-browser.cjs
          node --test tests/dp-photo-viewer.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/crushx-dp-check" --no-save --package-lock=false playwright@1.58.2
          "$RUNNER_TEMP/crushx-dp-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Launch local preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/dp-http.log" 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent --show-error http://127.0.0.1:8000/ -o /dev/null
      - name: Run pinch-and-zoom mobile Chromium checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/crushx-dp-check/node_modules/playwright
        run: node tests/dp-photo-viewer-browser.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-photo-viewer-mobile-browser
          path: dp-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
