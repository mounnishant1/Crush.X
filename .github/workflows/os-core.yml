name: Crush.X OS Core — Steps 2–6

on:
  pull_request:
    paths:
      - 'operating-system/**'
      - '.github/workflows/os-core.yml'
  push:
    branches:
      - feature/crushx-operating-system-core-s2-s6-20261103
    paths:
      - 'operating-system/**'
      - '.github/workflows/os-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server-only module syntax
        run: |
          for f in operating-system/index.cjs operating-system/core/*.cjs operating-system/features/*.cjs operating-system/providers/*.cjs operating-system/auth/*.cjs operating-system/media/*.cjs operating-system/consent/*.cjs operating-system/http/*.cjs operating-system/host/*.cjs operating-system/durable/*.cjs operating-system/tests/*.cjs; do
            node --check "$f"
          done
      - name: Run OS lifecycle, permissions, task and AURA security tests
        run: node --test operating-system/tests/*.test.cjs
